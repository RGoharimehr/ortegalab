<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LATFS · Reset Password</title>
    <link rel="canonical" href="https://latfs.villanova.edu/reset-password" />
    <link rel="icon" href="/assets/favicon.gif" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/reset-password.css" />
    <link rel="stylesheet" href="/modern.css" />
  </head>
  <body class="lab-console reset-password-surface">
    <div class="card login-card" id="card">
      <a class="login-brand" href="/" aria-label="LATFS public website"
        >LATFS<span>ACCOUNT ACCESS</span></a
      >
      <h1>Reset your password</h1>
      <p>Enter a new password for your LATFS account.</p>
      <form id="resetForm">
        <label for="newPass">New password</label>
        <input
          id="newPass"
          type="password"
          minlength="12"
          placeholder="At least 12 characters"
          required
          autocomplete="new-password"
        />
        <label for="confirmPass">Confirm password</label>
        <input
          id="confirmPass"
          type="password"
          minlength="12"
          placeholder="Repeat password"
          required
          autocomplete="new-password"
        />
        <button type="submit">Set new password</button>
        <div class="msg" id="msg" role="status" aria-live="polite"></div>
      </form>
      <a href="/platform">← Back to Platform</a>
    </div>
    <!-- Ordered classic scripts preserve the existing page handlers. -->
    <script src="/js/shared/http.js" defer></script>
    <script src="/js/shared/ui.js" defer></script>
    <script src="/js/reset-password/bootstrap.js" defer></script>
  </body>
</html>
