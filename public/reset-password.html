<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LATFS · Reset Password</title>
<link rel="canonical" href="https://latfs.villanova.edu/reset-password">
<link rel="icon" href="/assets/favicon.gif">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',system-ui,sans-serif;background:#0f172a;display:flex;align-items:center;justify-content:center;min-height:100vh;color:#e8edf5;}
.card{background:#162041;border-radius:12px;padding:40px 36px;width:100%;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,.5);}
h1{font-size:22px;font-weight:800;color:#fff;margin-bottom:6px;}
p{font-size:13px;color:#94a3b8;margin-bottom:22px;}
label{display:block;font-size:12px;font-weight:600;color:#94a3b8;margin-bottom:5px;margin-top:14px;text-transform:uppercase;letter-spacing:.05em;}
input{width:100%;padding:9px 12px;border:1px solid #2d4a78;border-radius:6px;background:#0f172a;color:#e8edf5;font-size:14px;}
input:focus{outline:none;border-color:#d4a942;}
button[type=submit]{margin-top:22px;width:100%;padding:11px;background:#d4a942;color:#0f172a;font-weight:700;font-size:14px;border:none;border-radius:6px;cursor:pointer;}
button[type=submit]:hover{background:#e8c972;}
.msg{margin-top:14px;font-size:13px;color:#94a3b8;text-align:center;}
.msg.ok{color:#4ade80;}
.msg.err{color:#f87171;}
a{color:#d4a942;text-decoration:none;font-size:13px;display:block;text-align:center;margin-top:18px;}
</style>
</head>
<body>
<div class="card" id="card">
  <h1>Reset your password</h1>
  <p>Enter a new password for your LATFS account.</p>
  <form id="resetForm">
    <label for="newPass">New password</label>
    <input id="newPass" type="password" minlength="8" placeholder="At least 8 characters" required autocomplete="new-password">
    <label for="confirmPass">Confirm password</label>
    <input id="confirmPass" type="password" minlength="8" placeholder="Repeat password" required autocomplete="new-password">
    <button type="submit">Set new password</button>
    <div class="msg" id="msg"></div>
  </form>
  <a href="/platform">← Back to Platform</a>
</div>
<script src="/js/reset-password.js"></script>
</body>
</html>
