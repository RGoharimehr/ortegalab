<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LATFS · Lab Platform</title>
<link rel="icon" href="/assets/favicon.gif">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ============================================================
   LATFS Design System — Colors & Type
   Laboratory for Advanced Thermal and Fluid Systems
   Villanova University
   ============================================================ */
/* ── Font imports ──────────────────────────────────────────── */
:root {
  /* ── Brand Colors ─────────────────────────────────────────
     LATFS is a Villanova-aligned research lab. The palette
     anchors on deep navy (institutional authority), academic
     gold (heritage / accent), and a warm cream (softens the
     academic tone so it feels approachable, not stuffy).
  */
  /* Primary — Navy */
  --navy-950: #080f24;
  --navy-900: #0f172a;    /* Primary brand navy (headers, nav) */
  --navy-800: #162041;
  --navy-700: #1e3a5f;    /* Legacy secondary navy (hovers) */
  --navy-600: #2d4a78;
  --navy-500: #4a6fa5;
  /* Accent — Academic Gold */
  --gold-900: #7a5e15;
  --gold-700: #9a7820;
  --gold-600: #b8912a;    /* Primary gold (accent bars, badges) */
  --gold-500: #d4a942;
  --gold-300: #e8c972;
  --gold-100: #fef7e4;    /* Soft gold tint for badges */
  --gold-50:  #fdfbf4;    /* Cream background */
  /* Neutrals — Warm gray (paired with navy, not cold blue-gray) */
  --gray-950: #0a0d13;
  --gray-900: #111827;
  --gray-800: #1f2937;
  --gray-700: #374151;
  --gray-600: #4b5563;
  --gray-500: #64748b;
  --gray-400: #94a3b8;
  --gray-300: #cbd5e1;
  --gray-200: #e2e8f0;
  --gray-100: #f1f5f9;
  --gray-50:  #f8fafc;
  /* Lab-status semantic colors (for inventory, tasks, etc.) */
  --status-ok:      #16a34a;    /* green — in stock, on track */
  --status-warn:    #d97706;    /* amber — low, at risk */
  --status-alert:   #dc2626;    /* red — out, blocked */
  --status-info:    #0284c7;    /* blue — neutral info */
  --status-ok-tint:    #dcfce7;
  --status-warn-tint:  #fef3c7;
  --status-alert-tint: #fee2e2;
  --status-info-tint:  #e0f2fe;
  /* ── Semantic tokens ──────────────────────────────────── */
  --fg-1: var(--navy-900);     /* primary text */
  --fg-2: var(--gray-700);     /* body text */
  --fg-3: var(--gray-500);     /* muted text */
  --fg-4: var(--gray-400);     /* tertiary / timestamps */
  --fg-inv: #ffffff;
  --bg-1: #ffffff;
  --bg-2: var(--gray-50);      /* page background */
  --bg-3: var(--gray-100);     /* subtle cards, fill inputs */
  --bg-dark: var(--navy-900);  /* nav, footer */
  --border-1: var(--gray-200); /* default borders */
  --border-2: var(--gray-300); /* stronger borders / dividers */
  --accent: var(--gold-600);
  --accent-soft: var(--gold-100);
  --accent-hover: var(--gold-700);
  /* ── Elevation ────────────────────────────────────────── */
  --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.12);
  --shadow-xl: 0 24px 60px rgba(15, 23, 42, 0.18);
  --shadow-inset: inset 0 1px 2px rgba(15, 23, 42, 0.05);
  /* ── Radii ────────────────────────────────────────────── */
  --radius-xs: 4px;     /* small inline chips */
  --radius-sm: 6px;     /* inputs, small buttons */
  --radius-md: 8px;     /* default buttons, tags */
  --radius-lg: 12px;    /* cards */
  --radius-xl: 16px;    /* feature cards, modals */
  --radius-pill: 999px; /* badges */
  /* ── Spacing (8-point grid, with 4 for inline) ──────── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;
  --space-20: 80px;
  /* ── Typography families ──────────────────────────────── */
  --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-display: 'Fraunces', 'Iowan Old Style', Georgia, serif; /* serif display for editorial flourishes — publication titles, quote blocks */
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  /* ── Type scale ──────────────────────────────────────── */
  --text-xs:   0.75rem;   /* 12px — meta, timestamps */
  --text-sm:   0.875rem;  /* 14px — secondary body */
  --text-base: 1rem;      /* 16px — body default */
  --text-lg:   1.125rem;  /* 18px — lead body */
  --text-xl:   1.25rem;   /* 20px — small headings */
  --text-2xl:  1.5rem;    /* 24px — h3 */
  --text-3xl:  1.875rem;  /* 30px — h2 */
  --text-4xl:  2.25rem;   /* 36px — h1 */
  --text-5xl:  3rem;      /* 48px — hero */
  --text-6xl:  3.75rem;   /* 60px — display */
  /* ── Motion ───────────────────────────────────────────── */
  --ease-out:   cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --dur-fast:   150ms;
  --dur-base:   220ms;
  --dur-slow:   400ms;
}
/* ============================================================
   Semantic element styles — drop into any page
   ============================================================ */
body {
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: 1.6;
  color: var(--fg-1);
  background: var(--bg-2);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
h1 {
  font-family: var(--font-sans);
  font-size: clamp(2rem, 4vw, var(--text-5xl));
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.1;
  color: var(--fg-1);
  margin: 0 0 var(--space-4);
}
h2 {
  font-size: var(--text-3xl);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.2;
  color: var(--fg-1);
  margin: 0 0 var(--space-3);
}
h3 {
  font-size: var(--text-xl);
  font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1.3;
  color: var(--fg-1);
  margin: 0 0 var(--space-2);
}
h4 {
  font-size: var(--text-lg);
  font-weight: 700;
  color: var(--fg-1);
  margin: 0 0 var(--space-2);
}
h5, h6 {
  font-size: var(--text-sm);
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--fg-3);
  margin: 0 0 var(--space-2);
}
p {
  font-size: var(--text-base);
  color: var(--fg-2);
  line-height: 1.65;
  margin: 0 0 var(--space-4);
  text-wrap: pretty;
}
small, .text-meta {
  font-size: var(--text-xs);
  color: var(--fg-4);
}
a {
  color: var(--navy-700);
  text-decoration: none;
  transition: color var(--dur-fast) var(--ease-out);
}
a:hover { color: var(--gold-700); }
code, kbd, pre {
  font-family: var(--font-mono);
  font-size: 0.92em;
}
code {
  background: var(--gray-100);
  padding: 0.1em 0.35em;
  border-radius: var(--radius-xs);
  color: var(--navy-800);
}
/* Serif display — use sparingly: publication titles, editorial quotes */
.display-serif {
  font-family: var(--font-display);
  font-weight: 600;
  letter-spacing: -0.02em;
}
/* Eyebrow / overline label — classic academic styling */
.eyebrow {
  font-family: var(--font-sans);
  font-size: var(--text-xs);
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold-700);
}
/* Section-header pattern: gold bar + title (used across lab site) */
.section-header {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  margin-bottom: var(--space-5);
}
.section-header::before {
  content: "";
  width: 3px;
  height: 1.5rem;
  background: var(--accent);
  border-radius: 2px;
  flex-shrink: 0;
}

/* Login overlay (kit doesn't define this — we add a simple navy gate) */
.login-screen { position:fixed; inset:0; background: var(--navy-900); display:flex; align-items:center; justify-content:center; z-index:9999; }
.login-card   { background:#fff; border-radius: var(--radius-xl); padding: 36px 32px; width: 360px; box-shadow: var(--shadow-xl); }
.login-card h1{ font-family: var(--font-display); font-size: 24px; color: var(--navy-900); margin: 0 0 4px; }
.login-card p { font-size: 13px; color: var(--fg-3); margin: 0 0 20px; }
.login-card label{ display:block; font-size:12px; font-weight:600; color:var(--fg-2); margin: 12px 0 4px; }
.login-card input{ width:100%; padding: 9px 10px; border:1px solid var(--border-1); border-radius: var(--radius-sm); font-family: inherit; font-size: 13px; box-sizing:border-box; }
.login-card button{ width:100%; margin-top: 18px; background: var(--gold-600); color:#fff; border:none; padding: 10px; border-radius: var(--radius-sm); font-weight: 700; font-size: 13px; cursor:pointer; font-family:inherit; }
.login-card button:hover{ background: var(--gold-700); }
.login-card .err{ color:#dc2626; font-size: 12px; margin-top: 10px; min-height: 14px; }
/* Sidebar logout button */
.p-logout { background:none; border:1px solid rgba(255,255,255,0.15); color:rgba(255,255,255,0.7); border-radius:6px; padding:6px 10px; font-size:11px; cursor:pointer; font-family:inherit; }
.p-logout:hover{ background:rgba(255,255,255,0.05); color:#fff; }
/* Modal (used for forms) */
.modal-bg { position:fixed; inset:0; background:rgba(15,23,42,0.5); display:flex; align-items:center; justify-content:center; z-index:1000; padding:16px; }
.modal { background:#fff; border-radius: var(--radius-lg); padding:24px; width: 480px; max-width:100%; max-height: 90vh; overflow:auto; box-shadow: var(--shadow-xl); }
.modal h2 { font-size:18px; font-weight:700; color: var(--navy-900); margin:0 0 6px; }
.modal-sub{ font-size:12px; color: var(--fg-3); margin:0 0 16px; }
.modal label{ display:block; font-size:12px; font-weight:600; color:var(--fg-2); margin: 10px 0 4px; }
.modal input, .modal select, .modal textarea{ width:100%; padding: 8px 10px; border:1px solid var(--border-1); border-radius: var(--radius-sm); font-family:inherit; font-size:13px; box-sizing:border-box; }
.modal textarea{ min-height: 80px; resize: vertical; }
.modal-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:18px; }
/* Empty state */
.empty { padding: 40px 20px; text-align:center; color: var(--fg-4); font-size: 13px; }
/* List item with delete button */
.row-actions { display:flex; gap:6px; }
.row-actions button { background:none; border:1px solid var(--border-1); color: var(--fg-3); padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor:pointer; font-family:inherit; }
.row-actions button:hover { background: var(--bg-2); color: var(--navy-900); }
.row-actions button.danger:hover { background: #fee2e2; color: #991b1b; border-color:#fca5a5; }
</style>
</head>
<body>

<!-- Login gate -->
<div id="loginScreen" class="login-screen" style="display:none">
  <div class="login-card">
    <h1>LATFS Platform</h1>
    <p>Sign in to manage the lab.</p>
    <form id="loginForm">
      <label>Username</label>
      <input id="lUser" type="text" autocomplete="username" required>
      <label>Password</label>
      <input id="lPass" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
      <div class="err" id="lErr"></div>
    </form>
  </div>
</div>

<!-- App shell -->
<div id="appShell" class="p-app" style="display:none">
  <aside class="p-sidebar">
    <div class="p-brand">
      <div class="p-brand-mark">L</div>
      <div>
        <div class="p-brand-wm">LATFS</div>
        <div class="p-brand-sub">Lab Platform</div>
      </div>
    </div>
    <nav class="p-nav" id="navMain"></nav>
    <div class="p-nav-section">
      <div class="p-nav-head">Admin</div>
      <button class="p-nav-item" data-route="admin">
        <i data-lucide="shield" class="p-nav-icon"></i>
        <span>Admin panel</span>
      </button>
    </div>
    <div class="p-user">
      <div class="p-user-av" id="userInitials">AO</div>
      <div style="flex:1">
        <div class="p-user-name" id="userName">Dr. A. Ortega</div>
        <div class="p-user-role" id="userRole">PI · Director</div>
      </div>
      <button class="p-logout" id="logoutBtn" title="Sign out">⎋</button>
    </div>
  </aside>

  <main class="p-main" id="mainContent">
    <div class="empty">Loading…</div>
  </main>
</div>

<script>
/* ===========================================================
   LATFS Platform — vanilla JS port of the React UI Kit
   =========================================================== */

let CSRF = '';
let SESSION_USER = { name:'Dr. A. Ortega', role:'PI · Director', initials:'AO', first:'Alfonso' };

const $ = (s, root=document) => root.querySelector(s);
const escHtml = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const initials = (name) => (name||'?').split(/\s+/).filter(Boolean).slice(0,2).map(s=>s[0]).join('').toUpperCase();

async function api(path, opts={}) {
  const headers = { 'Content-Type':'application/json' };
  if (CSRF) headers['X-CSRF-Token'] = CSRF;
  const r = await fetch(path, { credentials:'same-origin', ...opts, headers: {...headers, ...(opts.headers||{})} });
  if (!r.ok) {
    const txt = await r.text().catch(()=>'');
    throw new Error(`${r.status} ${r.statusText} ${txt}`);
  }
  return r.json();
}
const apiGet = (p) => api(p);
const apiPost = (p, body) => api(p, { method:'POST', body: JSON.stringify(body) });
const apiPut  = (p, body) => api(p, { method:'PUT',  body: JSON.stringify(body) });
const apiDel  = (p)       => api(p, { method:'DELETE' });

/* ── Auth ──────────────────────────────────────────────── */
async function checkAuth() {
  try {
    const data = await fetch('/admin/check', { credentials:'same-origin' }).then(r=>r.json());
    if (data.loggedIn) {
      CSRF = data.csrfToken || '';
      SESSION_USER.name = data.username === 'admin' ? 'Dr. A. Ortega' : data.username;
      SESSION_USER.initials = initials(SESSION_USER.name);
      return true;
    }
  } catch(e) { console.error('auth check failed', e); }
  return false;
}
async function doLogin(user, pass) {
  const r = await fetch('/admin/login', {
    method:'POST',
    credentials:'same-origin',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ username:user, password:pass })
  });
  if (!r.ok) throw new Error((await r.json()).error || 'Login failed');
  const data = await r.json();
  CSRF = data.csrfToken || '';
  return true;
}

/* ── Sidebar nav ───────────────────────────────────────── */
const NAV_ITEMS = [
  ['dashboard',  'Dashboard',  'home'],
  ['schedule',   'Schedule',   'calendar'],
  ['tasks',      'Tasks',      'check-square'],
  ['meetings',   'Meetings',   'users'],
  ['inventory',  'Inventory',  'package'],
  ['projects',   'Projects',   'flask-conical'],
];

let activeRoute = 'dashboard';

function renderNav() {
  $('#navMain').innerHTML = NAV_ITEMS.map(([id,label,icon]) =>
    `<button class="p-nav-item${id===activeRoute?' active':''}" data-route="${id}">
      <i data-lucide="${icon}" class="p-nav-icon"></i><span>${label}</span>
    </button>`
  ).join('');
  document.querySelectorAll('.p-sidebar [data-route]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.route === activeRoute);
    btn.onclick = () => navigate(btn.dataset.route);
  });
}

async function navigate(route) {
  activeRoute = route;
  renderNav();
  const main = $('#mainContent');
  main.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const renderer = ROUTES[route];
    if (!renderer) { main.innerHTML = '<div class="p-card"><em style="color:var(--fg-4)">Unknown route</em></div>'; return; }
    await renderer(main);
    if (window.lucide) window.lucide.createIcons();
  } catch(e) {
    console.error(e);
    main.innerHTML = `<div class="p-card"><strong>Error loading ${escHtml(route)}:</strong> ${escHtml(e.message)}</div>`;
  }
}

/* ── Modal helper ──────────────────────────────────────── */
function modal(title, sub, body, onSave) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal">
    <h2>${escHtml(title)}</h2>
    <p class="modal-sub">${escHtml(sub||'')}</p>
    <div class="modal-body">${body}</div>
    <div class="modal-actions">
      <button class="btn-ghost-sm" data-act="cancel">Cancel</button>
      <button class="btn-primary-sm" data-act="save">Save</button>
    </div>
  </div>`;
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  bg.querySelector('[data-act="cancel"]').onclick = close;
  bg.querySelector('[data-act="save"]').onclick = async () => {
    try { await onSave(bg.querySelector('.modal-body')); close(); }
    catch(e){ alert(e.message); }
  };
  if (window.lucide) window.lucide.createIcons();
  return bg;
}

/* ───────────────────────────────────────────────────────────
   DASHBOARD
   ─────────────────────────────────────────────────────────── */
async function renderDashboard(root) {
  const [meetings, tasks, inventory] = await Promise.all([
    apiGet('/api/meetings').catch(()=>[]),
    apiGet('/api/tasks').catch(()=>[]),
    apiGet('/api/inventory').catch(()=>[]),
  ]);
  const todayMeetings = meetings.filter(m => m.day_label === 'TODAY').length;
  const openTasks = tasks.filter(t => t.status !== 'done').length;
  const lowInv = inventory.filter(i => i.qty < i.min_qty).length;
  const todaySlots = meetings.filter(m => m.day_label === 'TODAY').slice(0,4);
  const myTasks = tasks.filter(t => t.status !== 'done').slice(0,4);
  const today = new Date().toLocaleDateString('en-US',{weekday:'long', month:'short', day:'numeric'}).toUpperCase();
  const hour = new Date().getHours();
  const greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';

  const tagColor = { team:'var(--navy-900)', experiment:'var(--gold-600)', '1:1':'var(--status-info)', external:'var(--gold-600)', review:'var(--status-warn)', onboarding:'var(--gold-700)', lab:'var(--fg-3)' };
  const taskTag = { todo:['To do','p-tag-outline'], doing:['Doing','p-tag-info'], review:['Review','p-tag-gold'], done:['Done','p-tag-ok'] };

  root.innerHTML = `
    <div class="p-page-head">
      <div>
        <div class="eyebrow" style="color:var(--gold-700)">${escHtml(today)}</div>
        <h1 class="p-h1">${greeting}, ${escHtml(SESSION_USER.first || SESSION_USER.name.split(' ')[0])}.</h1>
        <p class="p-h1-sub">${todayMeetings} meeting${todayMeetings===1?'':'s'} today · ${openTasks} open task${openTasks===1?'':'s'} · ${lowInv} inventory item${lowInv===1?'':'s'} need attention.</p>
      </div>
    </div>

    <div class="p-grid-3">
      <div class="p-stat-card">
        <i data-lucide="calendar-clock" class="p-stat-icon"></i>
        <div class="p-stat-num">${todayMeetings}</div>
        <div class="p-stat-lbl">Meetings today</div>
      </div>
      <div class="p-stat-card">
        <i data-lucide="check-square" class="p-stat-icon" style="color:var(--gold-600)"></i>
        <div class="p-stat-num">${openTasks}</div>
        <div class="p-stat-lbl">Open tasks</div>
      </div>
      <div class="p-stat-card">
        <i data-lucide="alert-triangle" class="p-stat-icon" style="color:var(--status-warn)"></i>
        <div class="p-stat-num">${lowInv}</div>
        <div class="p-stat-lbl">Inventory low</div>
      </div>
    </div>

    <div class="p-grid-2" style="margin-top:24px">
      <section class="p-card">
        <div class="p-card-head">
          <div class="p-card-title">Today's schedule</div>
          <button class="w-link-gold" data-jump="schedule">Full week →</button>
        </div>
        ${todaySlots.length ? todaySlots.map(s => `
          <div class="p-slot">
            <div class="p-slot-time">${escHtml((s.time_label||'').split('–')[0].trim())}</div>
            <div style="flex:1">
              <div class="p-slot-title">${escHtml(s.title)}</div>
              <div class="p-slot-room">${escHtml(s.room||'')}</div>
            </div>
            <span class="p-slot-tag" style="background:${tagColor[s.type]||'var(--fg-3)'}">${escHtml(s.type)}</span>
          </div>`).join('') : '<div class="empty">No meetings scheduled today.</div>'}
      </section>

      <section class="p-card">
        <div class="p-card-head">
          <div class="p-card-title">My tasks</div>
          <button class="w-link-gold" data-jump="tasks">All tasks →</button>
        </div>
        ${myTasks.length ? myTasks.map(t => {
          const [lbl, cls] = taskTag[t.status] || ['','p-tag-outline'];
          return `<div class="p-task">
            <input type="checkbox" class="p-check">
            <div style="flex:1">
              <div class="p-task-title">${escHtml(t.title)}</div>

  root.innerHTML = `
    <div class="p-page-head">

        <h1 class="p-h1">Schedule</h1>
        <p class="p-h1-sub">Week of March 18 · weekly grid · ${events.length} events</p>

          <div class="p-cal-col">
            ${hours.map(()=>`<div class="p-cal-cell"></div>`).join('')}
            ${events.filter(e=>e.day===di).map(e=>{
              const c = colorMap[e.color] || colorMap.navy;
              return `<div class="p-cal-event" data-id="${e.id}" style="top:${(e.start_hour-8)*46}px;height:${e.duration_hours*46-4}px;background:${c.bg};color:${c.fg}">

  `, async (mb) => {

      title: $('#m_title', mb).value, day: +$('#m_day', mb).value,
      start_hour: +$('#m_start', mb).value, duration_hours: +$('#m_dur', mb).value,

/* ───────────────────────────────────────────────────────────
   TASKS — kanban
   ─────────────────────────────────────────────────────────── */
async function renderTasks(root) {
  const tasks = await apiGet('/api/tasks');
  const COLS = [['todo','To do'], ['doing','Doing'], ['review','Review'], ['done','Done']];
  const tagBg = { inventory:'var(--status-info-tint)', experiment:'var(--gold-100)', lab:'var(--gray-100)', paper:'var(--status-info-tint)', maintenance:'var(--status-warn-tint)', data:'var(--gold-100)', team:'var(--gray-100)' };
  const tagFg = { inventory:'#075985', experiment:'var(--gold-700)', lab:'var(--fg-2)', paper:'#075985', maintenance:'#92400e', data:'var(--gold-700)', team:'var(--fg-2)' };

  const open = tasks.filter(t => t.status !== 'done').length;

  root.innerHTML = `
    <div class="p-page-head">
      <div>
        <h1 class="p-h1">Tasks</h1>
        <p class="p-h1-sub">${open} open across the lab · ${tasks.length} total</p>
      </div>
      <div class="p-actions">
        <button class="btn-ghost-sm">Filter</button>
        <button class="btn-primary-sm" id="newTask">+ New task</button>
      </div>
    </div>
    <div class="p-kanban">
      ${COLS.map(([sid,sname]) => {
        const items = tasks.filter(t=>t.status===sid);
        return `<div class="p-col" data-status="${sid}">
          <div class="p-col-head"><div class="p-col-title">${sname}</div><div class="p-col-count">${items.length}</div></div>
          ${items.map(it => `<div class="p-task-card" data-id="${it.id}">
            <div class="p-task-card-title">${escHtml(it.title)}</div>
            <div class="p-task-card-foot">
              <span class="p-tag-sm" style="background:${tagBg[it.tag]||'var(--gray-100)'};color:${tagFg[it.tag]||'var(--fg-2)'}">${escHtml(it.tag||'lab')}</span>
              <div class="p-task-meta">
                <span class="p-task-due-sm">${escHtml(it.due_label||'—')}</span>
                <div class="p-task-av" title="${escHtml(it.assignee||'')}">${escHtml(initials(it.assignee))}</div>
              </div>
            </div>
          </div>`).join('')}
          <button class="p-col-add" data-add="${sid}">+ Add task</button>
        </div>`;
      }).join('')}
    </div>
  `;

  // Click a task card → edit/delete
  root.querySelectorAll('.p-task-card').forEach(card => {
    card.onclick = async () => {
      const t = tasks.find(x => x.id == card.dataset.id);
      if (!t) return;
      modal('Edit task', '', `
        <label>Title</label><input id="m_title" value="${escHtml(t.title)}">
        <label>Assignee</label><input id="m_who" value="${escHtml(t.assignee||'')}">
        <label>Tag</label>
        <select id="m_tag">
          ${['inventory','experiment','lab','paper','maintenance','data','team'].map(x=>`<option value="${x}"${x===t.tag?' selected':''}>${x}</option>`).join('')}
        </select>
        <label>Due</label><input id="m_due" value="${escHtml(t.due_label||'')}">
        <label>Status</label>
        <select id="m_st">
          ${['todo','doing','review','done'].map(x=>`<option value="${x}"${x===t.status?' selected':''}>${x}</option>`).join('')}
        </select>
        <label>&nbsp;</label>
        <div class="row-actions"><button class="danger" id="m_del">Delete</button></div>
      `, async (mb) => {
        await apiPut('/api/tasks/'+t.id, {
          title: $('#m_title',mb).value, assignee: $('#m_who',mb).value,
          tag: $('#m_tag',mb).value, due_label: $('#m_due',mb).value,
          status: $('#m_st',mb).value, sort_order: t.sort_order||0
        });
        navigate('tasks');
      });
      // hook delete
      setTimeout(() => {
        const delBtn = document.querySelector('#m_del');
        if (delBtn) delBtn.onclick = async (e) => {
          e.preventDefault();
          if (!confirm('Delete this task?')) return;
          await apiDel('/api/tasks/'+t.id);
          document.querySelectorAll('.modal-bg').forEach(m=>m.remove());
          navigate('tasks');
        };
      }, 50);
    };
  });

  root.querySelectorAll('[data-add]').forEach(btn => btn.onclick = () => {
    const status = btn.dataset.add;
    modal('New task', `Adding to "${status}".`, `
      <label>Title</label><input id="m_title" placeholder="Calibrate PIV camera">
      <label>Assignee</label><input id="m_who" placeholder="A. Park">
      <label>Tag</label>
      <select id="m_tag">${['inventory','experiment','lab','paper','maintenance','data','team'].map(x=>`<option value="${x}">${x}</option>`).join('')}</select>
      <label>Due</label><input id="m_due" placeholder="Fri">
    `, async (mb) => {
      await apiPost('/api/tasks', {
        title: $('#m_title',mb).value, assignee: $('#m_who',mb).value,
        tag: $('#m_tag',mb).value, due_label: $('#m_due',mb).value, status
      });
      navigate('tasks');
    });
  });

  $('#newTask').onclick = () => $('[data-add="todo"]').click();
}

let _invLab = 'A';
async function renderInventory(root) {
  const items = await apiGet('/api/inventory');
  const labA = items.filter(i => i.lab==='A');
  const labB = items.filter(i => i.lab==='B');
  const list = _invLab==='A'?labA:labB;
  const stateOf = (it) => it.qty===0 ? 'alert' : it.qty < it.min_qty ? 'warn' : 'ok';
  const stateMap = { ok:{cls:'p-tag-ok',lbl:'In stock',c:'var(--status-ok)'}, warn:{cls:'p-tag-warn',lbl:'Low',c:'var(--status-warn)'}, alert:{cls:'p-tag-alert',lbl:'Out',c:'var(--status-alert)'} };
  const low = list.filter(i => stateOf(i)!=='ok').length;

  root.innerHTML = `
    <div class="p-page-head">
      <div>
        <h1 class="p-h1">Inventory</h1>
        <p class="p-h1-sub">Tracked across two lab spaces · ${low} item${low===1?'':'s'} need attention</p>
      </div>
      <div class="p-actions">
        <button class="btn-ghost-sm">Export CSV</button>
        <button class="btn-primary-sm" id="newInv">+ Add item</button>
      </div>
    </div>

    <div class="p-tabs">
      <button class="p-tab${_invLab==='A'?' active':''}" data-lab="A">Lab A · Tolentine 344 <span class="p-tab-count">${labA.length}</span></button>
      <button class="p-tab${_invLab==='B'?' active':''}" data-lab="B">Lab B · Mendel 270 <span class="p-tab-count">${labB.length}</span></button>
    </div>

    <div class="p-inv-toolbar">
      <div class="p-inv-search">
        <i data-lucide="search" class="p-inv-search-i"></i>
        <input id="invSearch" class="p-inv-input" placeholder="Search SKU, name, category…">
      </div>
      <select class="p-inv-select"><option>All categories</option></select>
      <select class="p-inv-select"><option>All status</option></select>
    </div>

    <div class="p-inv-table" id="invTable">
      <div class="p-inv-row p-inv-head">
        <div style="flex-basis:140px">SKU</div>
        <div style="flex:2">Item</div>
        <div style="flex:1">Category</div>
        <div style="flex:1">Quantity</div>
        <div style="flex:1">Status</div>
        <div style="flex-basis:80px"></div>
      </div>
      ${list.map(it => {
        const st = stateOf(it); const sm = stateMap[st];
        return `<div class="p-inv-row" data-id="${it.id}">
          <div style="flex-basis:140px"><code class="p-mono">${escHtml(it.sku)}</code></div>
          <div style="flex:2" class="p-inv-name">${escHtml(it.name)}</div>
          <div style="flex:1" class="p-inv-cat">${escHtml(it.category||'')}</div>
          <div style="flex:1">
            <div><span class="p-qty-num">${it.qty}</span><span class="p-qty-min"> / min ${it.min_qty}</span></div>
            <div class="p-qty-bar"><div class="p-qty-fill" style="width:${Math.min(100,(it.qty/Math.max(it.min_qty,1))*60)}%;background:${sm.c}"></div></div>
          </div>
          <div style="flex:1">
            <span class="p-tag ${sm.cls}"><span class="p-dot" style="background:${sm.c}"></span>${sm.lbl}</span>
          </div>
          <div style="flex-basis:80px;text-align:right" class="row-actions">
            <button data-edit="${it.id}">Edit</button>
            <button class="danger" data-del="${it.id}">×</button>
          </div>
        </div>`;
      }).join('')}
    </div>
  `;

  root.querySelectorAll('[data-lab]').forEach(b => b.onclick = () => { _invLab = b.dataset.lab; renderInventory(root); if(window.lucide) window.lucide.createIcons(); });
  root.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('Delete item?')) return;
    await apiDel('/api/inventory/'+b.dataset.del);
    renderInventory(root);
  });
  root.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openInvModal(items.find(x=>x.id==b.dataset.edit)));
  $('#newInv').onclick = () => openInvModal(null);
  $('#invSearch').oninput = (e) => {
    const q = e.target.value.toLowerCase();
    root.querySelectorAll('#invTable .p-inv-row:not(.p-inv-head)').forEach(r => {
      r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  };

  function openInvModal(it) {
    const isNew = !it;
    it = it || { lab:_invLab, sku:'', name:'', category:'', qty:0, min_qty:0 };
    modal(isNew?'Add inventory item':'Edit item','',`
      <label>Lab</label><select id="m_lab"><option value="A"${it.lab==='A'?' selected':''}>Lab A</option><option value="B"${it.lab==='B'?' selected':''}>Lab B</option></select>

      <label>Name</label><input id="m_name" value="${escHtml(it.name)}">
      <label>Category</label><input id="m_cat" value="${escHtml(it.category||'')}" placeholder="Sensors / Hardware / Consumables / Fluids / Optics / PPE">
      <label>Quantity</label><input id="m_qty" type="number" value="${it.qty}">
      <label>Min quantity</label><input id="m_min" type="number" value="${it.min_qty}">
    `, async (mb) => {
      const body = {
        lab: $('#m_lab',mb).value, sku: $('#m_sku',mb).value, name: $('#m_name',mb).value,
        category: $('#m_cat',mb).value, qty: +$('#m_qty',mb).value, min_qty: +$('#m_min',mb).value,
        sort_order: it.sort_order||0
      };
      if (isNew) await apiPost('/api/inventory', body);
      else await apiPut('/api/inventory/'+it.id, body);
      renderInventory(root); if(window.lucide) window.lucide.createIcons();
    });
  }
}

async function renderProjects(root) {
  const projs = await apiGet('/api/projects');
  const statusTag = { active:['Active','p-tag-ok','var(--status-ok)'], paused:['Paused','p-tag-warn','var(--status-warn)'], completed:['Completed','p-tag-info','var(--status-info)'] };

      <div>

      </div>
    </div>

    <div class="p-grid-2">
      ${projs.map(p => {
        const [lbl,cls,c] = statusTag[p.status] || statusTag.active;
        return `<div class="p-card">
          <div class="p-card-head">
            <div class="p-card-title">${escHtml(p.title)}</div>
            <span class="p-tag ${cls}"><span class="p-dot" style="background:${c}"></span>${lbl}</span>
          </div>
          <div style="font-size:13px;color:var(--fg-2);line-height:1.55;margin-bottom:12px">${escHtml(p.description||'')}</div>

            <div><strong>Lead:</strong> ${escHtml(p.lead||'—')}</div>
            <div class="row-actions">
              <button data-edit="${p.id}">Edit</button>
              <button class="danger" data-del="${p.id}">Delete</button>
            </div>
          </div>
        </div>`;
      }).join('') || '<div class="empty p-card">No projects yet.</div>'}
    </div>
  `;

    if(!confirm('Delete project?')) return;

  $('#newProj').onclick = () => openProj(null);

  function openProj(p) {
    const isNew = !p;
    p = p || { title:'', lead:'', status:'active', description:'' };
    modal(isNew?'New project':'Edit project','',`
      <label>Title</label><input id="m_t" value="${escHtml(p.title)}">

    `, async (mb) => {
      const body = { title:$('#m_t',mb).value, lead:$('#m_l',mb).value, status:$('#m_s',mb).value, description:$('#m_d',mb).value, sort_order:p.sort_order||0 };
      if(isNew) await apiPost('/api/projects', body); else await apiPut('/api/projects/'+p.id, body);

}

/* ───────────────────────────────────────────────────────────
   ADMIN — Members / Content / Apps / Settings / Audit
   Members + Content + Apps render real lab data (people/news/publications/research/sponsors)
   ─────────────────────────────────────────────────────────── */
let _adminTab = 'members';
async function renderAdmin(root) {
  root.innerHTML = `
    <div class="p-page-head">
      <div>
        <div class="eyebrow" style="color:var(--gold-700)">Administration</div>
        <h1 class="p-h1">Admin Panel</h1>
        <p class="p-h1-sub">Members, content publishing, and site settings.</p>
      </div>
      <div class="p-actions">
        <button class="btn-ghost-sm" id="logoutTop"><i data-lucide="log-out" style="width:12px;height:12px;margin-right:4px"></i>Sign out</button>
      </div>
    </div>

    <div class="p-grid-3" style="margin-bottom:20px" id="adminStats"></div>

    <div class="p-tabs" id="adminTabs">
      ${[['members','Members & Roles','users'],
         ['news','News','megaphone'],
         ['publications','Publications','book-open'],
         ['research','Research','flask-conical'],
         ['people','People','user'],
         ['settings','Settings','settings']
        ].map(([id,lbl,icn]) =>
        `<button class="p-tab${id===_adminTab?' active':''}" data-tab="${id}"><i data-lucide="${icn}" style="width:14px;height:14px"></i> ${lbl}</button>`
      ).join('')}
    </div>

    <div id="adminBody"></div>
  `;
  root.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { _adminTab = b.dataset.tab; renderAdmin(root); if(window.lucide) window.lucide.createIcons(); });
  $('#logoutTop').onclick = doLogout;

  // Stats
  const [people, pubs, news] = await Promise.all([
    apiGet('/api/people').catch(()=>[]),
    apiGet('/api/publications').catch(()=>[]),
    apiGet('/api/news').catch(()=>[]),
  ]);
  $('#adminStats').innerHTML = `
    <div class="p-stat-card"><i data-lucide="users" class="p-stat-icon"></i><div class="p-stat-num">${people.length}</div><div class="p-stat-lbl">Lab members</div></div>
    <div class="p-stat-card"><i data-lucide="book-open" class="p-stat-icon"></i><div class="p-stat-num">${pubs.length}</div><div class="p-stat-lbl">Publications</div></div>
    <div class="p-stat-card"><i data-lucide="megaphone" class="p-stat-icon"></i><div class="p-stat-num">${news.length}</div><div class="p-stat-lbl">News items</div></div>
  `;

  const body = $('#adminBody');
  if (_adminTab === 'members') renderMembersTab(body, people);
  else if (_adminTab === 'news') renderNewsTab(body, news);
  else if (_adminTab === 'publications') renderPubsTab(body, pubs);
  else if (_adminTab === 'research') renderResearchTab(body);
  else if (_adminTab === 'people') renderPeopleTab(body, people);
  else if (_adminTab === 'settings') renderSettingsTab(body);

  if (window.lucide) window.lucide.createIcons();
}

/* ───────────────────────────────────────────────────────────
   Boot + auth flow
   ─────────────────────────────────────────────────────────── */
const ROUTES = {
  dashboard: renderDashboard, schedule: renderSchedule, tasks: renderTasks,
  meetings: renderMeetings, inventory: renderInventory, projects: renderProjects, admin: renderAdmin,
};

async function doLogout() {
  await fetch('/admin/logout',{method:'POST',credentials:'same-origin'}).catch(()=>{});
  CSRF = '';
  $('#appShell').style.display = 'none';
  $('#loginScreen').style.display = 'flex';
}

async function boot() {
  $('#loginForm').onsubmit = async (e) => {
    e.preventDefault();
    $('#lErr').textContent = '';
    try {
      await doLogin($('#lUser').value, $('#lPass').value);
      $('#loginScreen').style.display = 'none';
      $('#appShell').style.display = 'flex';
      $('#userInitials').textContent = SESSION_USER.initials;
      $('#userName').textContent = SESSION_USER.name;
      navigate('dashboard');
    } catch(err) { $('#lErr').textContent = err.message; }
  };
  $('#logoutBtn').onclick = doLogout;

  const ok = await checkAuth();
  if (ok) {
    $('#appShell').style.display = 'flex';
    $('#userInitials').textContent = SESSION_USER.initials;
    $('#userName').textContent = SESSION_USER.name;
    renderNav();
    navigate('dashboard');
  } else {
    $('#loginScreen').style.display = 'flex';
  }
  if (window.lucide) window.lucide.createIcons();
}

boot();
</script>
