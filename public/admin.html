<style>
/* ============================================================
   LATFS Design System — Colors & Type
   Laboratory for Advanced Thermal and Fluid Systems
   Villanova University
   ============================================================ */
/* ── Font imports ──────────────────────────────────────────── */
:root {
  /* ── Brand Colors ─────────────────────────────────────────
     LATFS is a Villanova-aligned research lab. The palette
     anchors on deep navy (institutional authority), academic
     gold (heritage / accent), and a warm cream (softens the
     academic tone so it feels approachable, not stuffy).
  */
  /* Primary — Navy */
  --navy-950: #080f24;
  --navy-900: #0f172a;    /* Primary brand navy (headers, nav) */
  --navy-800: #162041;
  --navy-700: #1e3a5f;    /* Legacy secondary navy (hovers) */
  --navy-600: #2d4a78;
  --navy-500: #4a6fa5;
  /* Accent — Academic Gold */
  --gold-900: #7a5e15;
  --gold-700: #9a7820;
  --gold-600: #b8912a;    /* Primary gold (accent bars, badges) */
  --gold-500: #d4a942;
  --gold-300: #e8c972;
  --gold-100: #fef7e4;    /* Soft gold tint for badges */
  --gold-50:  #fdfbf4;    /* Cream background */
  /* Neutrals — Warm gray (paired with navy, not cold blue-gray) */
  --gray-950: #0a0d13;
  --gray-900: #111827;
  --gray-800: #1f2937;
  --gray-700: #374151;
  --gray-600: #4b5563;
  --gray-500: #64748b;
  --gray-400: #94a3b8;
  --gray-300: #cbd5e1;
  --gray-200: #e2e8f0;
  --gray-100: #f1f5f9;
  --gray-50:  #f8fafc;
  /* Lab-status semantic colors (for inventory, tasks, etc.) */
  --status-ok:      #16a34a;    /* green — in stock, on track */
  --status-warn:    #d97706;    /* amber — low, at risk */
  --status-alert:   #dc2626;    /* red — out, blocked */
  --status-info:    #0284c7;    /* blue — neutral info */
  --status-ok-tint:    #dcfce7;
  --status-warn-tint:  #fef3c7;
  --status-alert-tint: #fee2e2;
  --status-info-tint:  #e0f2fe;
  /* ── Semantic tokens ──────────────────────────────────── */
  --fg-1: var(--navy-900);     /* primary text */
  --fg-2: var(--gray-700);     /* body text */
  --fg-3: var(--gray-500);     /* muted text */
  --fg-4: var(--gray-400);     /* tertiary / timestamps */
  --fg-inv: #ffffff;
  --bg-1: #ffffff;
  --bg-2: var(--gray-50);      /* page background */
  --bg-3: var(--gray-100);     /* subtle cards, fill inputs */
  --bg-dark: var(--navy-900);  /* nav, footer */
  --border-1: var(--gray-200); /* default borders */
  --border-2: var(--gray-300); /* stronger borders / dividers */
  --accent: var(--gold-600);
  --accent-soft: var(--gold-100);
  --accent-hover: var(--gold-700);
  /* ── Elevation ────────────────────────────────────────── */
  --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.12);
  --shadow-xl: 0 24px 60px rgba(15, 23, 42, 0.18);
  --shadow-inset: inset 0 1px 2px rgba(15, 23, 42, 0.05);
  /* ── Radii ────────────────────────────────────────────── */
  --radius-xs: 4px;     /* small inline chips */
  --radius-sm: 6px;     /* inputs, small buttons */
  --radius-md: 8px;     /* default buttons, tags */
  --radius-lg: 12px;    /* cards */
  --radius-xl: 16px;    /* feature cards, modals */
  --radius-pill: 999px; /* badges */
  /* ── Spacing (8-point grid, with 4 for inline) ──────── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;
  --space-20: 80px;
  /* ── Typography families ──────────────────────────────── */
  --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-display: 'Fraunces', 'Iowan Old Style', Georgia, serif; /* serif display for editorial flourishes — publication titles, quote blocks */
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  /* ── Type scale ──────────────────────────────────────── */
  --text-xs:   0.75rem;   /* 12px — meta, timestamps */
  --text-sm:   0.875rem;  /* 14px — secondary body */
  --text-base: 1rem;      /* 16px — body default */
  --text-lg:   1.125rem;  /* 18px — lead body */
  --text-xl:   1.25rem;   /* 20px — small headings */
  --text-2xl:  1.5rem;    /* 24px — h3 */
  --text-3xl:  1.875rem;  /* 30px — h2 */
  --text-4xl:  2.25rem;   /* 36px — h1 */
  --text-5xl:  3rem;      /* 48px — hero */
  --text-6xl:  3.75rem;   /* 60px — display */
  /* ── Motion ───────────────────────────────────────────── */
  --ease-out:   cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --dur-fast:   150ms;
  --dur-base:   220ms;
  --dur-slow:   400ms;
}
/* ============================================================
   Semantic element styles — drop into any page
   ============================================================ */
body {
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: 1.6;
  color: var(--fg-1);
  background: var(--bg-2);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
h1 {
  font-family: var(--font-sans);
  font-size: clamp(2rem, 4vw, var(--text-5xl));
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.1;
  color: var(--fg-1);
  margin: 0 0 var(--space-4);
}
h2 {
  font-size: var(--text-3xl);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.2;
  color: var(--fg-1);
  margin: 0 0 var(--space-3);
}
h3 {
  font-size: var(--text-xl);
  font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1.3;
  color: var(--fg-1);
  margin: 0 0 var(--space-2);
}
h4 {
  font-size: var(--text-lg);
  font-weight: 700;
  color: var(--fg-1);
  margin: 0 0 var(--space-2);
}
h5, h6 {
  font-size: var(--text-sm);
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--fg-3);
  margin: 0 0 var(--space-2);
}
p {
  font-size: var(--text-base);
  color: var(--fg-2);
  line-height: 1.65;
  margin: 0 0 var(--space-4);
  text-wrap: pretty;
}
small, .text-meta {
  font-size: var(--text-xs);
  color: var(--fg-4);
}
a {
  color: var(--navy-700);
  text-decoration: none;
  transition: color var(--dur-fast) var(--ease-out);
}
a:hover { color: var(--gold-700); }
code, kbd, pre {
  font-family: var(--font-mono);
  font-size: 0.92em;
}
code {
  background: var(--gray-100);
  padding: 0.1em 0.35em;
  border-radius: var(--radius-xs);
  color: var(--navy-800);
}
/* Serif display — use sparingly: publication titles, editorial quotes */
.display-serif {
  font-family: var(--font-display);
  font-weight: 600;
  letter-spacing: -0.02em;
}
/* Eyebrow / overline label — classic academic styling */
.eyebrow {
  font-family: var(--font-sans);
  font-size: var(--text-xs);
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold-700);
}
/* Section-header pattern: gold bar + title (used across lab site) */
.section-header {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  margin-bottom: var(--space-5);
}
.section-header::before {
  content: "";
  width: 3px;
  height: 1.5rem;
  background: var(--accent);
  border-radius: 2px;
  flex-shrink: 0;
}

/* Login overlay (kit doesn't define this — we add a simple navy gate) */
.login-screen { position:fixed; inset:0; background: var(--navy-900); display:flex; align-items:center; justify-content:center; z-index:9999; }
.login-card   { background:#fff; border-radius: var(--radius-xl); padding: 36px 32px; width: 360px; box-shadow: var(--shadow-xl); }
.login-card h1{ font-family: var(--font-display); font-size: 24px; color: var(--navy-900); margin: 0 0 4px; }
.login-card p { font-size: 13px; color: var(--fg-3); margin: 0 0 20px; }
.login-card label{ display:block; font-size:12px; font-weight:600; color:var(--fg-2); margin: 12px 0 4px; }
.login-card input{ width:100%; padding: 9px 10px; border:1px solid var(--border-1); border-radius: var(--radius-sm); font-family: inherit; font-size: 13px; box-sizing:border-box; }
.login-card button{ width:100%; margin-top: 18px; background: var(--gold-600); color:#fff; border:none; padding: 10px; border-radius: var(--radius-sm); font-weight: 700; font-size: 13px; cursor:pointer; font-family:inherit; }
.login-card button:hover{ background: var(--gold-700); }
.login-card .err{ color:#dc2626; font-size: 12px; margin-top: 10px; min-height: 14px; }
/* Sidebar logout button */
.p-logout { background:none; border:1px solid rgba(255,255,255,0.15); color:rgba(255,255,255,0.7); border-radius:6px; padding:6px 10px; font-size:11px; cursor:pointer; font-family:inherit; }
.p-logout:hover{ background:rgba(255,255,255,0.05); color:#fff; }
/* Modal (used for forms) */
.modal-bg { position:fixed; inset:0; background:rgba(15,23,42,0.5); display:flex; align-items:center; justify-content:center; z-index:1000; padding:16px; }
.modal { background:#fff; border-radius: var(--radius-lg); padding:24px; width: 480px; max-width:100%; max-height: 90vh; overflow:auto; box-shadow: var(--shadow-xl); }
.modal h2 { font-size:18px; font-weight:700; color: var(--navy-900); margin:0 0 6px; }
.modal-sub{ font-size:12px; color: var(--fg-3); margin:0 0 16px; }
.modal label{ display:block; font-size:12px; font-weight:600; color:var(--fg-2); margin: 10px 0 4px; }
.modal input, .modal select, .modal textarea{ width:100%; padding: 8px 10px; border:1px solid var(--border-1); border-radius: var(--radius-sm); font-family:inherit; font-size:13px; box-sizing:border-box; }
.modal textarea{ min-height: 80px; resize: vertical; }
.modal-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:18px; }
/* Empty state */
.empty { padding: 40px 20px; text-align:center; color: var(--fg-4); font-size: 13px; }
/* List item with delete button */
.row-actions { display:flex; gap:6px; }
.row-actions button { background:none; border:1px solid var(--border-1); color: var(--fg-3); padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor:pointer; font-family:inherit; }
.row-actions button:hover { background: var(--bg-2); color: var(--navy-900); }
.row-actions button.danger:hover { background: #fee2e2; color: #991b1b; border-color:#fca5a5; }


/* ---- Platform layout (sidebar/main, cards, kanban, calendar, etc.) ---- */
html, body { margin: 0; background: var(--bg-2); color: var(--fg-1); }
  .p-app { display: flex; min-height: 100vh; }
  .p-main { flex: 1; padding: 28px 32px; overflow: auto; }

  /* Sidebar */
  .p-sidebar { width: 240px; background: var(--navy-900); color: rgba(255,255,255,.8); display: flex; flex-direction: column; padding: 20px 12px; }
  .p-brand { display: flex; gap: 10px; align-items: center; padding: 4px 8px 20px; border-bottom: 1px solid rgba(255,255,255,.08); margin-bottom: 12px; }
  .p-brand-mark { width: 32px; height: 32px; border-radius: 50%; background: var(--gold-600); color: #fff; font-weight: 900; display: flex; align-items: center; justify-content: center; }
  .p-brand-wm { color: #fff; font-weight: 800; font-size: 14px; }
  .p-brand-sub { font-size: 10px; color: rgba(255,255,255,.5); letter-spacing: .08em; text-transform: uppercase; }
  .p-nav, .p-nav-section { display: flex; flex-direction: column; gap: 2px; }
  .p-nav-section { margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.08); }
  .p-nav-head { font-size: 10px; color: rgba(255,255,255,.4); letter-spacing: .1em; text-transform: uppercase; padding: 4px 12px 8px; }
  .p-nav-item { background: none; border: none; color: rgba(255,255,255,.7); text-align: left; padding: 8px 12px; border-radius: 6px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13px; font-weight: 500; font-family: inherit; }
  .p-nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
  .p-nav-item.active { background: var(--gold-600); color: #fff; }
  .p-nav-icon { width: 16px; height: 16px; }
  .p-user { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid rgba(255,255,255,.08); }
  .p-user-av { width: 32px; height: 32px; border-radius: 50%; background: var(--gold-600); color: #fff; font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center; }
  .p-user-name { color: #fff; font-size: 13px; font-weight: 600; }
  .p-user-role { color: rgba(255,255,255,.5); font-size: 11px; }

  /* Page head */
  .p-page-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; }
  .p-h1 { font-size: 1.5rem; font-weight: 800; color: var(--navy-900); margin: 4px 0 4px; letter-spacing: -.02em; }
  .p-h1-sub { font-size: 13px; color: var(--fg-3); margin: 0; }
  .p-actions { display: flex; gap: 8px; }
  .btn-primary-sm { background: var(--gold-600); color: #fff; border: none; border-radius: 6px; padding: 7px 14px; font-weight: 600; font-size: 13px; cursor: pointer; font-family: inherit; }
  .btn-primary-sm:hover { background: var(--gold-700); }
  .btn-ghost-sm { background: #fff; border: 1px solid var(--border-1); color: var(--fg-2); border-radius: 6px; padding: 6px 12px; font-weight: 600; font-size: 12px; cursor: pointer; font-family: inherit; }
  .btn-ghost-sm:hover { background: var(--bg-1); }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }

  /* Cards + grid */
  .p-card { background: #fff; border: 1px solid var(--border-1); border-radius: 12px; padding: 18px; box-shadow: var(--shadow-xs); }
  .p-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--border-1); }
  .p-card-title { font-weight: 700; font-size: 14px; color: var(--navy-900); }
  .p-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .p-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .p-stat-card { background: #fff; border: 1px solid var(--border-1); border-left: 3px solid var(--gold-600); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 4px; position: relative; box-shadow: var(--shadow-xs); }
  .p-stat-icon { position: absolute; top: 14px; right: 14px; width: 18px; height: 18px; color: var(--fg-4); }
  .p-stat-num { font-size: 1.75rem; font-weight: 800; color: var(--navy-900); line-height: 1; }
  .p-stat-lbl { font-size: 12px; color: var(--fg-3); }
  .w-link-gold { background: none; border: none; color: var(--gold-700); font-weight: 600; font-size: 12px; cursor: pointer; padding: 4px 0; font-family: inherit; }

  /* Slots */
  .p-slot { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--border-1); }
  .p-slot:last-child { border-bottom: none; }
  .p-slot-time { font-family: var(--font-mono); font-size: 12px; color: var(--fg-3); font-weight: 600; width: 44px; }
  .p-slot-title { font-size: 13px; color: var(--navy-900); font-weight: 600; }
  .p-slot-room { font-size: 11px; color: var(--fg-4); }
  .p-slot-tag { color: #fff; font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; }

  /* Tasks in dashboard */
  .p-task { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--border-1); }
  .p-task:last-child { border-bottom: none; }
  .p-check { width: 14px; height: 14px; accent-color: var(--gold-600); }
  .p-task-title { font-size: 13px; color: var(--navy-900); font-weight: 500; }
  .p-task-due { font-size: 11px; color: var(--fg-4); }

  /* Tags */
  .p-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; letter-spacing: .02em; }
  .p-tag-ok { background: var(--status-ok-tint); color: #166534; }
  .p-tag-warn { background: var(--status-warn-tint); color: #92400e; }
  .p-tag-alert { background: var(--status-alert-tint); color: #991b1b; }
  .p-tag-info { background: var(--status-info-tint); color: #075985; }
  .p-tag-gold { background: var(--gold-100); color: var(--gold-700); }
  .p-tag-outline { background: #fff; border: 1px solid var(--border-2); color: var(--fg-3); }
  .p-dot { width: 6px; height: 6px; border-radius: 50%; }

  /* Lab status */
  .p-lab-name { font-size: 12px; font-weight: 700; color: var(--fg-2); letter-spacing: .04em; margin-bottom: 6px; text-transform: uppercase; }
  .p-lab-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--border-1); }
  .p-lab-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .p-lab-lbl { font-size: 13px; color: var(--navy-900); font-weight: 500; }
  .p-lab-meta { font-size: 11px; color: var(--fg-4); }
  .p-lab-state { font-size: 11px; color: var(--fg-3); font-weight: 600; }

  /* Calendar */
  .p-cal { background: #fff; border: 1px solid var(--border-1); border-radius: 12px; overflow: hidden; }
  .p-cal-head { display: grid; grid-template-columns: 60px repeat(5, 1fr); border-bottom: 1px solid var(--border-1); background: var(--bg-1); }
  .p-cal-day-h { padding: 10px 12px; font-size: 12px; font-weight: 700; color: var(--navy-900); border-left: 1px solid var(--border-1); }
  .p-cal-body { display: grid; grid-template-columns: 60px repeat(5, 1fr); position: relative; }
  .p-cal-hours { display: flex; flex-direction: column; }
  .p-cal-hour { height: 46px; font-size: 10px; color: var(--fg-4); padding: 2px 8px; border-bottom: 1px solid var(--border-1); font-family: var(--font-mono); }
  .p-cal-col { position: relative; border-left: 1px solid var(--border-1); }
  .p-cal-cell { height: 46px; border-bottom: 1px solid var(--border-1); }
  .p-cal-event { position: absolute; left: 4px; right: 4px; border-radius: 6px; padding: 6px 8px; font-size: 11px; overflow: hidden; box-shadow: var(--shadow-xs); cursor: pointer; }
  .p-cal-ev-title { font-weight: 700; line-height: 1.2; }
  .p-cal-ev-room { font-size: 10px; opacity: .8; margin-top: 2px; }

  /* Kanban */
  .p-kanban { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .p-col { background: var(--bg-1); border: 1px solid var(--border-1); border-radius: 10px; padding: 10px; }
  .p-col-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 0 4px; }
  .p-col-title { font-size: 12px; font-weight: 700; color: var(--navy-900); letter-spacing: .02em; text-transform: uppercase; }
  .p-col-count { font-size: 11px; font-weight: 700; color: var(--fg-4); background: #fff; border: 1px solid var(--border-1); border-radius: 999px; padding: 1px 8px; }
  .p-task-card { background: #fff; border: 1px solid var(--border-1); border-left: 3px solid var(--gold-600); border-radius: 8px; padding: 10px; margin-bottom: 8px; box-shadow: var(--shadow-xs); cursor: pointer; }
  .p-task-card:hover { box-shadow: var(--shadow-sm); transform: translateY(-1px); }
  .p-task-card-title { font-size: 13px; color: var(--navy-900); font-weight: 600; line-height: 1.35; margin-bottom: 8px; }
  .p-task-card-foot { display: flex; justify-content: space-between; align-items: center; }
  .p-tag-sm { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; letter-spacing: .02em; }
  .p-task-meta { display: flex; align-items: center; gap: 8px; }
  .p-task-due-sm { font-size: 11px; color: var(--fg-4); }
  .p-task-av { width: 22px; height: 22px; border-radius: 50%; background: var(--navy-700); color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }

<body>

<script>
/* ===========================================================
   LATFS Platform — vanilla JS port of the React UI Kit
   =========================================================== */

let CSRF = '';
let SESSION_USER = { name:'Dr. A. Ortega', role:'PI · Director', initials:'AO', first:'Alfonso' };

const $ = (s, root=document) => root.querySelector(s);
const escHtml = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const initials = (name) => (name||'?').split(/\s+/).filter(Boolean).slice(0,2).map(s=>s[0]).join('').toUpperCase();
const fmtDT = (d) => { if(!d) return ''; const x = new Date(d); if(isNaN(x)) return d; return x.toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); };

async function api(path, opts={}) {
  const headers = { 'Content-Type':'application/json' };
  if (CSRF) headers['X-CSRF-Token'] = CSRF;
  const r = await fetch(path, { credentials:'same-origin', ...opts, headers: {...headers, ...(opts.headers||{})} });
  if (!r.ok) {
    const txt = await r.text().catch(()=>'');
    throw new Error(`${r.status} ${r.statusText} ${txt}`);
  }
  return r.json();
}
const apiGet = (p) => api(p);
const apiPost = (p, body) => api(p, { method:'POST', body: JSON.stringify(body) });
const apiPut  = (p, body) => api(p, { method:'PUT',  body: JSON.stringify(body) });
const apiDel  = (p)       => api(p, { method:'DELETE' });

async function uploadPhoto(file) {
  const fd = new FormData(); fd.append('photo', file);
  const r = await fetch('/api/upload/photo', { method:'POST', credentials:'same-origin', headers:{ 'X-CSRF-Token': CSRF }, body: fd });
  if(!r.ok) throw new Error('Upload failed: '+r.status);
  return (await r.json()).url;
}
async function uploadDoc(file) {
  const fd = new FormData(); fd.append('document', file);
  const r = await fetch('/api/upload/document', { method:'POST', credentials:'same-origin', headers:{ 'X-CSRF-Token': CSRF }, body: fd });
  if(!r.ok) throw new Error('Upload failed: '+r.status);
  return await r.json();
}
async function uploadGallery(file, caption='', sort_order=0) {
  const fd = new FormData(); fd.append('photo', file); fd.append('caption', caption); fd.append('sort_order', sort_order);
  const r = await fetch('/api/gallery', { method:'POST', credentials:'same-origin', headers:{ 'X-CSRF-Token': CSRF }, body: fd });
  if(!r.ok) throw new Error('Upload failed: '+r.status);
  return await r.json();
}
async function uploadHeroSlide(file, title='', caption='', sort_order=0) {
  const fd = new FormData(); fd.append('photo', file); fd.append('title', title); fd.append('caption', caption); fd.append('sort_order', sort_order);
  const r = await fetch('/api/hero-slides', { method:'POST', credentials:'same-origin', headers:{ 'X-CSRF-Token': CSRF }, body: fd });
  if(!r.ok) throw new Error('Upload failed: '+r.status);
  return await r.json();
}

/* ── Auth ──────────────────────────────────────────────── */
async function checkAuth() {
  try {
    const data = await fetch('/admin/check', { credentials:'same-origin' }).then(r=>r.json());
    if (data.loggedIn) {
      CSRF = data.csrfToken || '';
      SESSION_USER.name = data.name || data.username;
      SESSION_USER.role = data.role || 'admin';
      SESSION_USER.first = (data.name || data.username || '?').split(' ')[0] || '?';
      SESSION_USER.initials = initials(SESSION_USER.name);
      return true;
    }
  } catch(e) { console.error('auth check failed', e); }
  return false;
}
async function doLogin(user, pass) {
  const r = await fetch('/admin/login', {
    method:'POST',
    credentials:'same-origin',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ username:user, password:pass })
  });
  if (!r.ok) throw new Error((await r.json()).error || 'Login failed');
  const data = await r.json();
  CSRF = data.csrfToken || '';
  SESSION_USER.name = data.name || data.username;
  SESSION_USER.role = data.role || 'admin';
  SESSION_USER.first = (data.name || data.username || '?').split(' ')[0] || '?';
  SESSION_USER.initials = initials(SESSION_USER.name);
  return true;
}

/* ── Sidebar nav ───────────────────────────────────────── */
const NAV_ITEMS = [
  ['overview',   'Overview',     'home'],
  ['content',    'Site content', 'edit-3'],
  ['schedule',   'Schedule',     'calendar'],
  ['tasks',      'Tasks',        'check-square'],
  ['meetings',   'Meetings',     'users'],
  ['inventory',  'Inventory',    'package'],
  ['projects',   'Projects',     'folder'],
];

let activeRoute = 'overview';

function renderNav() {
  $('#navMain').innerHTML = NAV_ITEMS.map(([id,label,icon]) =>
    `<button class="p-nav-item${id===activeRoute?' active':''}" data-route="${id}">
      <i data-lucide="${icon}" class="p-nav-icon"></i><span>${label}</span>
    </button>`
  ).join('');
  document.querySelectorAll('.p-sidebar [data-route]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.route === activeRoute);
    btn.onclick = () => navigate(btn.dataset.route);
  });
}

async function navigate(route) {
  activeRoute = route;
  renderNav();
  const main = $('#mainContent');
  main.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const renderer = ROUTES[route];
    if (!renderer) { main.innerHTML = '<div class="p-card"><em style="color:var(--fg-4)">Unknown route</em></div>'; return; }
    await renderer(main);
    if (window.lucide) window.lucide.createIcons();
  } catch(e) {
    console.error(e);
    main.innerHTML = `<div class="p-card"><strong>Error loading ${escHtml(route)}:</strong> ${escHtml(e.message)}</div>`;
  }
}

/* ── Modal helper ──────────────────────────────────────── */
function modal(title, sub, body, onSave) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal">
    <h2>${escHtml(title)}</h2>
    <p class="modal-sub">${escHtml(sub||'')}</p>
    <div class="modal-body">${body}</div>
    <div class="modal-actions">
      <button class="btn-ghost-sm" data-act="cancel">Cancel</button>
      <button class="btn-primary-sm" data-act="save">Save</button>
    </div>
  </div>`;
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  bg.querySelector('[data-act="cancel"]').onclick = close;
  bg.querySelector('[data-act="save"]').onclick = async () => {
    try { await onSave(bg.querySelector('.modal-body')); close(); }
    catch(e){ alert(e.message); }
  };
  if (window.lucide) window.lucide.createIcons();
  return bg;
}

/* ───────────────────────────────────────────────────────────
   DASHBOARD
   ─────────────────────────────────────────────────────────── */
async function renderDashboard(root) {
  const [meetings, tasks, inventory] = await Promise.all([
    apiGet('/api/meetings').catch(()=>[]),
    apiGet('/api/tasks').catch(()=>[]),
    apiGet('/api/inventory').catch(()=>[]),
  ]);
  const todayMeetings = meetings.filter(m => m.day_label === 'TODAY').length;
  const openTasks = tasks.filter(t => t.status !== 'done').length;
  const lowInv = inventory.filter(i => i.qty < i.min_qty).length;
  const todaySlots = meetings.filter(m => m.day_label === 'TODAY').slice(0,4);
  const myTasks = tasks.filter(t => t.status !== 'done').slice(0,4);
  const today = new Date().toLocaleDateString('en-US',{weekday:'long', month:'short', day:'numeric'}).toUpperCase();
  const hour = new Date().getHours();
  const greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';

  const tagColor = { team:'var(--navy-900)', experiment:'var(--gold-600)', '1:1':'var(--status-info)', external:'var(--gold-600)', review:'var(--status-warn)', onboarding:'var(--gold-700)', lab:'var(--fg-3)' };
  const taskTag = { todo:['To do','p-tag-outline'], doing:['Doing','p-tag-info'], review:['Review','p-tag-gold'], done:['Done','p-tag-ok'] };

  root.innerHTML = `
    <div class="p-page-head">
      <div>
        <div class="eyebrow" style="color:var(--gold-700)">${escHtml(today)}</div>
        <h1 class="p-h1">${greeting}, ${escHtml(SESSION_USER.first || SESSION_USER.name.split(' ')[0])}.</h1>
        <p class="p-h1-sub">${todayMeetings} meeting${todayMeetings===1?'':'s'} today · ${openTasks} open task${openTasks===1?'':'s'} · ${lowInv} inventory item${lowInv===1?'':'s'} need attention.</p>
      </div>
    </div>

    <div class="p-grid-3">
      <div class="p-stat-card">
        <i data-lucide="calendar-clock" class="p-stat-icon"></i>
        <div class="p-stat-num">${todayMeetings}</div>
        <div class="p-stat-lbl">Meetings today</div>
      </div>
      <div class="p-stat-card">
        <i data-lucide="check-square" class="p-stat-icon" style="color:var(--gold-600)"></i>
        <div class="p-stat-num">${openTasks}</div>
        <div class="p-stat-lbl">Open tasks</div>
      </div>
      <div class="p-stat-card">
        <i data-lucide="alert-triangle" class="p-stat-icon" style="color:var(--status-warn)"></i>
        <div class="p-stat-num">${lowInv}</div>
        <div class="p-stat-lbl">Inventory low</div>
      </div>
    </div>

    <div class="p-grid-2" style="margin-top:24px">
      <section class="p-card">
        <div class="p-card-head">
          <div class="p-card-title">Today's schedule</div>
          <button class="w-link-gold" data-jump="schedule">Full week →</button>
        </div>
        ${todaySlots.length ? todaySlots.map(s => `
          <div class="p-slot">
            <div class="p-slot-time">${escHtml((s.time_label||'').split('–')[0].trim())}</div>
            <div style="flex:1">
              <div class="p-slot-title">${escHtml(s.title)}</div>
              <div class="p-slot-room">${escHtml(s.room||'')}</div>
            </div>
            <span class="p-slot-tag" style="background:${tagColor[s.type]||'var(--fg-3)'}">${escHtml(s.type)}</span>
          </div>`).join('') : '<div class="empty">No meetings scheduled today.</div>'}
      </section>

      <section class="p-card">
        <div class="p-card-head">
          <div class="p-card-title">My tasks</div>
          <button class="w-link-gold" data-jump="tasks">All tasks →</button>
        </div>
        ${myTasks.length ? myTasks.map(t => {
          const [lbl, cls] = taskTag[t.status] || ['','p-tag-outline'];
          return `<div class="p-task">
            <input type="checkbox" class="p-check">
            <div style="flex:1">
              <div class="p-task-title">${escHtml(t.title)}</div>
              <div class="p-task-due">Due ${escHtml(t.due_label||'—')}</div>
            </div>
            <span class="p-tag ${cls}">${lbl}</span>
          </div>`;
        }).join('') : '<div class="empty">No open tasks. ✨</div>'}
      </section>
    </div>

    <section class="p-card" style="margin-top:24px">
      <div class="p-card-head">
        <div class="p-card-title">Lab status</div>
        <span class="p-tag p-tag-ok">All systems nominal</span>
      </div>
      <div class="p-grid-2">
        <div>
          <div class="p-lab-name">Lab A · Tolentine 344</div>
          <div class="p-lab-row"><span class="p-lab-dot" style="background:var(--status-ok)"></span><div style="flex:1"><div class="p-lab-lbl">Boiling rig</div><div class="p-lab-meta">M. Reyes · ends 16:00</div></div><span class="p-lab-state">Running</span></div>
          <div class="p-lab-row"><span class="p-lab-dot" style="background:var(--fg-4)"></span><div style="flex:1"><div class="p-lab-lbl">PIV system</div><div class="p-lab-meta">Last used yesterday</div></div><span class="p-lab-state">Idle</span></div>
          <div class="p-lab-row"><span class="p-lab-dot" style="background:var(--status-info)"></span><div style="flex:1"><div class="p-lab-lbl">High-speed camera</div><div class="p-lab-meta">A. Park · tomorrow 09:00</div></div><span class="p-lab-state">Booked</span></div>
        </div>
        <div>
          <div class="p-lab-name">Lab B · Mendel 270</div>
          <div class="p-lab-row"><span class="p-lab-dot" style="background:var(--fg-4)"></span><div style="flex:1"><div class="p-lab-lbl">Thermocouple bench</div></div><span class="p-lab-state">Idle</span></div>
          <div class="p-lab-row"><span class="p-lab-dot" style="background:var(--status-warn)"></span><div style="flex:1"><div class="p-lab-lbl">Droplet impingement rig</div><div class="p-lab-meta">Pump replaced Mon</div></div><span class="p-lab-state">Maintenance</span></div>
          <div class="p-lab-row"><span class="p-lab-dot" style="background:var(--fg-4)"></span><div style="flex:1"><div class="p-lab-lbl">IR thermography</div></div><span class="p-lab-state">Idle</span></div>
        </div>

  `;
  root.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => navigate(b.dataset.jump));

/* ───────────────────────────────────────────────────────────
   SCHEDULE — list view using real server schema
   ─────────────────────────────────────────────────────────── */
async function renderSchedule(root) {
  const events = await apiGet('/api/events');
  const now = new Date();
  const upcoming = events
    .filter(e => e.start_time)
    .sort((a,b) => new Date(a.start_time) - new Date(b.start_time));

  root.innerHTML = `
    <div class="p-page-head">
      <div>
        <h1 class="p-h1">Schedule</h1>
        <p class="p-h1-sub">${upcoming.length} upcoming event${upcoming.length===1?'':'s'}</p>
      </div>
      <div class="p-actions">
        <button class="btn-primary-sm" id="newEvent">+ New event</button>
      </div>
    </div>
    <div class="p-card" id="schedTable">
      ${upcoming.length ? upcoming.map(e => `
        <div class="p-slot">
          <div class="p-slot-time">${new Date(e.start_time).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</div>
          <div style="flex:1;">
            <div class="p-slot-title">${escHtml(e.title)}</div>
            <div class="p-slot-room">${fmtDT(e.start_time)}${e.end_time?' → '+fmtDT(e.end_time):''} · ${escHtml(e.location||'')}</div>
          </div>
          <span class="p-tag p-tag-outline">${escHtml(e.event_type||'event')}</span>
          <div class="row-actions">
            <button data-ev-edit="${e.id}">Edit</button>
            <button class="danger" data-ev-del="${e.id}">Delete</button>
          </div>
        </div>`).join('') : '<div class="empty">No upcoming events.</div>'}
    </div>
  `;

  root.querySelectorAll('[data-ev-del]').forEach(b => b.onclick = async () => {
    if (!confirm('Delete this event?')) return;
    await apiDel('/api/events/'+b.dataset.evDel);
    navigate('schedule');
  });
  root.querySelectorAll('[data-ev-edit]').forEach(b => b.onclick = () => {
    const ev = events.find(x => x.id == b.dataset.evEdit);
    openEventModal(ev);
  });

  function openEventModal(ev) {
    const isNew = !ev;
    ev = ev || {};
    modal(isNew ? 'New event' : 'Edit event', '', `
      <label>Title</label><input id="m_title" value="${escHtml(ev.title||'')}" placeholder="e.g. Boiling rig run">
      <label>Type</label>
      <select id="m_type">
        ${['meeting','seminar','reservation','other'].map(t=>`<option value="${t}"${(ev.event_type||'meeting')===t?' selected':''}>${t}</option>`).join('')}
      </select>
      <label>Start</label><input id="m_start" type="datetime-local" value="${ev.start_time?ev.start_time.slice(0,16):''}">
      <label>End (optional)</label><input id="m_end" type="datetime-local" value="${ev.end_time?ev.end_time.slice(0,16):''}">
      <label>Location</label><input id="m_loc" value="${escHtml(ev.location||'')}">
    `, async (mb) => {
      const body = {
        title: $('#m_title',mb).value.trim(),
        event_type: $('#m_type',mb).value,
        start_time: $('#m_start',mb).value,
        end_time: $('#m_end',mb).value || null,
        location: $('#m_loc',mb).value
      };
      if (!body.title || !body.start_time) throw new Error('Title and start time are required');
      if (isNew) await apiPost('/api/events', body);
      else await apiPut('/api/events/'+ev.id, body);
      navigate('schedule');
    });
  }

  $('#newEvent').onclick = () => openEventModal(null);
}

   TASKS — kanban
   ─────────────────────────────────────────────────────────── */
async function renderTasks(root) {
  const tasks = await apiGet('/api/tasks');
  const COLS = [['todo','To do'], ['doing','Doing'], ['review','Review'], ['done','Done']];
  const tagBg = { inventory:'var(--status-info-tint)', experiment:'var(--gold-100)', lab:'var(--gray-100)', paper:'var(--status-info-tint)', maintenance:'var(--status-warn-tint)', data:'var(--gold-100)', team:'var(--gray-100)' };
  const tagFg = { inventory:'#075985', experiment:'var(--gold-700)', lab:'var(--fg-2)', paper:'#075985', maintenance:'#92400e', data:'var(--gold-700)', team:'var(--fg-2)' };

  const open = tasks.filter(t => t.status !== 'done').length;

  root.innerHTML = `
    <div class="p-page-head">
      <div>
        <h1 class="p-h1">Tasks</h1>
        <p class="p-h1-sub">${open} open across the lab · ${tasks.length} total</p>
      </div>
      <div class="p-actions">
        <button class="btn-ghost-sm">Filter</button>
        <button class="btn-primary-sm" id="newTask">+ New task</button>
      </div>
    </div>
    <div class="p-kanban">
      ${COLS.map(([sid,sname]) => {
        const items = tasks.filter(t=>t.status===sid);
        return `<div class="p-col" data-status="${sid}">
          <div class="p-col-head"><div class="p-col-title">${sname}</div><div class="p-col-count">${items.length}</div></div>
          ${items.map(it => `<div class="p-task-card" data-id="${it.id}">
            <div class="p-task-card-title">${escHtml(it.title)}</div>
            <div class="p-task-card-foot">
              <span class="p-tag-sm" style="background:${tagBg[it.tag]||'var(--gray-100)'};color:${tagFg[it.tag]||'var(--fg-2)'}">${escHtml(it.tag||'lab')}</span>
              <div class="p-task-meta">
                <span class="p-task-due-sm">${escHtml(it.due_label||'—')}</span>
                <div class="p-task-av" title="${escHtml(it.assignee||'')}">${escHtml(initials(it.assignee))}</div>
              </div>
            </div>
          </div>`).join('')}
          <button class="p-col-add" data-add="${sid}">+ Add task</button>
        </div>`;
      }).join('')}
    </div>
  `;

  // Click a task card → edit/delete
  root.querySelectorAll('.p-task-card').forEach(card => {
    card.onclick = async () => {
      const t = tasks.find(x => x.id == card.dataset.id);
      if (!t) return;
      const bg = modal('Edit task', '', `
        <label>Title</label><input id="m_title" value="${escHtml(t.title)}">
        <label>Assignee</label><input id="m_who" value="${escHtml(t.assignee||'')}">
        <label>Tag</label>
        <select id="m_tag">
          ${['inventory','experiment','lab','paper','maintenance','data','team'].map(x=>`<option value="${x}"${x===t.tag?' selected':''}>${x}</option>`).join('')}
        </select>
        <label>Due</label><input id="m_due" value="${escHtml(t.due_label||'')}">
        <label>Status</label>
        <select id="m_st">
          ${['todo','doing','review','done'].map(x=>`<option value="${x}"${x===t.status?' selected':''}>${x}</option>`).join('')}
        </select>
        <label>&nbsp;</label>
        <div class="row-actions"><button class="danger" id="m_del">Delete</button></div>
      `, async (mb) => {
        await apiPut('/api/tasks/'+t.id, {
          title: $('#m_title',mb).value, assignee: $('#m_who',mb).value,
          tag: $('#m_tag',mb).value, due_label: $('#m_due',mb).value,
          status: $('#m_st',mb).value, sort_order: t.sort_order||0
        });
        navigate('tasks');
      });
      // hook delete button directly on the returned modal element
      const delBtn = bg.querySelector('#m_del');
      if (delBtn) delBtn.onclick = async (e) => {
        e.preventDefault();
        if (!confirm('Delete this task?')) return;
        await apiDel('/api/tasks/'+t.id);
        bg.remove();
        navigate('tasks');
      };
    };
  });

  root.querySelectorAll('[data-add]').forEach(btn => btn.onclick = () => {
    const status = btn.dataset.add;
    modal('New task', `Adding to "${status}".`, `
      <label>Title</label><input id="m_title" placeholder="Calibrate PIV camera">
      <label>Assignee</label><input id="m_who" placeholder="A. Park">
      <label>Tag</label>
      <select id="m_tag">${['inventory','experiment','lab','paper','maintenance','data','team'].map(x=>`<option value="${x}">${x}</option>`).join('')}</select>
      <label>Due</label><input id="m_due" placeholder="Fri">
    `, async (mb) => {
      await apiPost('/api/tasks', {
        title: $('#m_title',mb).value, assignee: $('#m_who',mb).value,
        tag: $('#m_tag',mb).value, due_label: $('#m_due',mb).value, status
      });
      navigate('tasks');
    });
  });

  $('#newTask').onclick = () => $('[data-add="todo"]').click();
}

let _invLab = 'A';
async function renderInventory(root, embedded=false) {
  const items = await apiGet('/api/inventory');
  const labA = items.filter(i => i.lab==='A');
  const labB = items.filter(i => i.lab==='B');
  const list = _invLab==='A'?labA:labB;
  const stateOf = (it) => it.qty===0 ? 'alert' : it.qty < it.min_qty ? 'warn' : 'ok';
  const stateMap = { ok:{cls:'p-tag-ok',lbl:'In stock',c:'var(--status-ok)'}, warn:{cls:'p-tag-warn',lbl:'Low',c:'var(--status-warn)'}, alert:{cls:'p-tag-alert',lbl:'Out',c:'var(--status-alert)'} };
  const low = list.filter(i => stateOf(i)!=='ok').length;

  root.innerHTML = `
    ${!embedded ? `<div class="p-page-head">
      <div>
        <h1 class="p-h1">Inventory</h1>
        <p class="p-h1-sub">Tracked across two lab spaces · ${low} item${low===1?'':'s'} need attention</p>
      </div>
      <div class="p-actions">
        <button class="btn-ghost-sm">Export CSV</button>
        <button class="btn-primary-sm" id="newInv">+ Add item</button>
      </div>
    </div>` : `<div class="p-inv-toolbar" style="justify-content:flex-end;">
      <button class="btn-primary-sm" id="newInv">+ Add item</button>
    </div>`}

    <div class="p-tabs">
      <button class="p-tab${_invLab==='A'?' active':''}" data-lab="A">Lab A · Tolentine 344 <span class="p-tab-count">${labA.length}</span></button>
      <button class="p-tab${_invLab==='B'?' active':''}" data-lab="B">Lab B · Mendel 270 <span class="p-tab-count">${labB.length}</span></button>
    </div>

    <div class="p-inv-toolbar">
      <div class="p-inv-search">
        <i data-lucide="search" class="p-inv-search-i"></i>
        <input id="invSearch" class="p-inv-input" placeholder="Search SKU, name, category…">
      </div>
      <select class="p-inv-select"><option>All categories</option></select>
      <select class="p-inv-select"><option>All status</option></select>
    </div>

    <div class="p-inv-table" id="invTable">
      <div class="p-inv-row p-inv-head">
        <div style="flex-basis:140px">SKU</div>
        <div style="flex:2">Item</div>
        <div style="flex:1">Category</div>
        <div style="flex:1">Quantity</div>
        <div style="flex:1">Status</div>
        <div style="flex-basis:80px"></div>
      </div>
      ${list.map(it => {
        const st = stateOf(it); const sm = stateMap[st];
        return `<div class="p-inv-row" data-id="${it.id}">
          <div style="flex-basis:140px"><code class="p-mono">${escHtml(it.sku)}</code></div>
          <div style="flex:2" class="p-inv-name">${escHtml(it.name)}</div>
          <div style="flex:1" class="p-inv-cat">${escHtml(it.category||'')}</div>
          <div style="flex:1">
            <div><span class="p-qty-num">${it.qty}</span><span class="p-qty-min"> / min ${it.min_qty}</span></div>
            <div class="p-qty-bar"><div class="p-qty-fill" style="width:${Math.min(100,(it.qty/Math.max(it.min_qty,1))*60)}%;background:${sm.c}"></div></div>
          </div>
          <div style="flex:1">
            <span class="p-tag ${sm.cls}"><span class="p-dot" style="background:${sm.c}"></span>${sm.lbl}</span>
          </div>
          <div style="flex-basis:80px;text-align:right" class="row-actions">
            <button data-edit="${it.id}">Edit</button>
            <button class="danger" data-del="${it.id}">×</button>
          </div>
        </div>`;
      }).join('')}
    </div>
  `;

  root.querySelectorAll('[data-lab]').forEach(b => b.onclick = () => { _invLab = b.dataset.lab; renderInventory(root); if(window.lucide) window.lucide.createIcons(); });
  root.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('Delete item?')) return;
    await apiDel('/api/inventory/'+b.dataset.del);
    renderInventory(root);
  });
  root.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openInvModal(items.find(x=>x.id==b.dataset.edit)));
  $('#newInv').onclick = () => openInvModal(null);
  $('#invSearch').oninput = (e) => {
    const q = e.target.value.toLowerCase();
    root.querySelectorAll('#invTable .p-inv-row:not(.p-inv-head)').forEach(r => {
      r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  };

  function openInvModal(it) {
    const isNew = !it;
    it = it || { lab:_invLab, sku:'', name:'', category:'', qty:0, min_qty:0 };
    modal(isNew?'Add inventory item':'Edit item','',`
      <label>Lab</label><select id="m_lab"><option value="A"${it.lab==='A'?' selected':''}>Lab A</option><option value="B"${it.lab==='B'?' selected':''}>Lab B</option></select>
      <label>SKU</label><input id="m_sku" value="${escHtml(it.sku)}" placeholder="SN-LAT-00000">
      <label>Name</label><input id="m_name" value="${escHtml(it.name)}">
      <label>Category</label><input id="m_cat" value="${escHtml(it.category||'')}" placeholder="Sensors / Hardware / Consumables / Fluids / Optics / PPE">
      <label>Quantity</label><input id="m_qty" type="number" value="${it.qty}">
      <label>Min quantity</label><input id="m_min" type="number" value="${it.min_qty}">
    `, async (mb) => {
      const body = {
        lab: $('#m_lab',mb).value, sku: $('#m_sku',mb).value, name: $('#m_name',mb).value,
        category: $('#m_cat',mb).value, qty: +$('#m_qty',mb).value, min_qty: +$('#m_min',mb).value,
        sort_order: it.sort_order||0
      };
      if (isNew) await apiPost('/api/inventory', body);
      else await apiPut('/api/inventory/'+it.id, body);
      renderInventory(root); if(window.lucide) window.lucide.createIcons();
    });
  }
}

  function openP(p) {

    modal(isNew?'Add person':'Edit person','',`
      <label>Name</label><input id="m_n" value="${escHtml(p.name)}">
      <label>Role</label><input id="m_r" value="${escHtml(p.role)}">
      <label>Category</label>
      <select id="m_c">${['director','manager','faculty','postdoc','phd','ms','ug','alumni','collaborator'].map(x=>`<option value="${x}"${x===p.category?' selected':''}>${x}</option>`).join('')}</select>
      <label>Email</label><input id="m_e" value="${escHtml(p.email||'')}">
      <label>Profile photo (upload)</label>
      <div style="display:flex; gap:10px; align-items:center;">
        <img id="m_ph_prev" src="${escHtml(p.photo_url||'')}" alt="" style="width:54px;height:54px;border-radius:50%;object-fit:cover;object-position:${escHtml(p.photo_position||'center center')};background:var(--bg-1);border:1px solid var(--border-1);${p.photo_url?'':'visibility:hidden;'}">
        <input type="file" id="m_ph_file" accept="image/*" style="flex:1;">
      </div>
      <label>Photo URL (or use upload above)</label><input id="m_ph" value="${escHtml(p.photo_url||'')}">
      <label>Photo focal point — click on the image to choose what should be centered in the circle</label>
      <div id="m_ph_picker" style="position:relative; width:300px; height:300px; border:1px solid var(--border-1); border-radius:8px; overflow:hidden; background:var(--bg-1); cursor:crosshair;">
        <img id="m_ph_picker_img" src="${escHtml(p.photo_url||'')}" alt="" style="width:100%; height:100%; object-fit:contain; ${p.photo_url?'':'display:none;'}">
        <div id="m_ph_picker_dot" style="position:absolute; width:18px; height:18px; border:2px solid var(--gold-600); background:rgba(255,255,255,.6); border-radius:50%; transform:translate(-50%,-50%); pointer-events:none; left:50%; top:50%;"></div>
      </div>
      <input id="m_pp" type="hidden" value="${escHtml(p.photo_position||'center center')}">
      <label>Result preview</label>
      <img id="m_ph_result" src="${escHtml(p.photo_url||'')}" alt="" style="width:120px;height:120px;border-radius:50%;object-fit:cover;object-position:${escHtml(p.photo_position||'center center')};border:3px solid #fff; box-shadow:var(--shadow-sm); ${p.photo_url?'':'display:none;'}">
      <label>LinkedIn URL</label><input id="m_li" value="${escHtml(p.linkedin_url||'')}" placeholder="https://linkedin.com/in/...">
      <label>Personal website (optional)</label><input id="m_ws" value="${escHtml(p.website_url||'')}">
      <label>Bio</label><textarea id="m_b" style="min-height:120px;">${escHtml(p.bio||'')}</textarea>
    `, async (mb) => {
      const f = $('#m_ph_file', mb);
      if (f && f.files && f.files[0]) {
        const url = await uploadPhoto(f.files[0]);
        $('#m_ph', mb).value = url;
        $('#m_ph_picker_img', mb).src = url; $('#m_ph_picker_img', mb).style.display = 'block';
        $('#m_ph_result', mb).src = url; $('#m_ph_result', mb).style.display = 'inline-block';
      }
      const body = { name:$('#m_n',mb).value, role:$('#m_r',mb).value, category:$('#m_c',mb).value, email:$('#m_e',mb).value, photo_url:$('#m_ph',mb).value, photo_position:$('#m_pp',mb).value, linkedin_url:$('#m_li',mb).value, website_url:$('#m_ws',mb).value, bio:$('#m_b',mb).value, active:1 };
      if(isNew) await apiPost('/api/people', body); else await apiPut('/api/people/'+p.id, body);
      renderAdmin($('#mainContent'));
    });
    // Wire up the focal-point picker on the modal we just opened
    setTimeout(() => {
      const picker = document.getElementById('m_ph_picker');
      if (!picker) return;
      const img = document.getElementById('m_ph_picker_img');
      const dot = document.getElementById('m_ph_picker_dot');
      const result = document.getElementById('m_ph_result');
      const hidden = document.getElementById('m_pp');
      // Initial dot position
      const init = (hidden.value || 'center center').split(' ');
      const xMap = { left: '0%', center: '50%', right: '100%' };
      const yMap = { top: '0%', center: '50%', bottom: '100%' };
      const initX = xMap[init[0]] || init[0] || '50%';
      const initY = yMap[init[1]] || init[1] || '50%';
      dot.style.left = initX; dot.style.top = initY;
      picker.addEventListener('click', e => {
        if (!img.src) return;
        const rect = picker.getBoundingClientRect();
        const xPct = ((e.clientX - rect.left) / rect.width * 100).toFixed(1) + '%';
        const yPct = ((e.clientY - rect.top) / rect.height * 100).toFixed(1) + '%';
        dot.style.left = xPct; dot.style.top = yPct;
        const pos = xPct + ' ' + yPct;
        hidden.value = pos;
        if (result) { result.style.objectPosition = pos; result.style.display = 'inline-block'; }
      });
    }, 0);
  }
}

          <img src="${escHtml(g.image_url)}" alt="" style="width:100%; height:170px; object-fit:cover; display:block; background:var(--bg-1);">
          <div style="padding:10px 12px;">
            <div style="font-size:12px;color:var(--fg-2);">${escHtml(g.caption||'(no caption)')}</div>
            <div class="row-actions" style="margin-top:8px;"><button class="danger" data-del="${g.id}">Delete</button></div>
          </div>
        </div>`).join('') : '<div class="empty">No gallery photos yet.</div>'}
    </div>
  `;
  body.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if(!confirm('Delete this photo?')) return;
    await apiDel('/api/gallery/'+b.dataset.del); renderAdmin($('#mainContent'));
  });
  $('#newPic').onclick = () => {
    modal('Add gallery photo','',`
      <label>Image file (required)</label><input type="file" id="m_f" accept="image/*">
      <label>Caption</label><input id="m_c" value="">
      <label>Sort order</label><input id="m_s" type="number" value="0">
    `, async (mb) => {
      const f = $('#m_f', mb);
      if (!f.files[0]) throw new Error('Please pick an image file');
      await uploadGallery(f.files[0], $('#m_c', mb).value, +$('#m_s', mb).value);
      renderAdmin($('#mainContent'));
    });
  };
}

async function renderSponsorsTab(body) {
  const sponsors = await apiGet('/api/sponsors').catch(()=>[]);
  body.innerHTML = `
    <div style="font-size:13px; color:var(--fg-3); margin-bottom:14px;">Sponsors and collaborators. Logo and name appear on the homepage marquee. URL links the logo. Mark "show in footer" to also display in the footer.</div>
    <div class="p-inv-toolbar"><button class="btn-primary-sm" id="newSp">+ Add sponsor / collaborator</button></div>
    <div class="p-inv-table">
      <div class="p-inv-row p-inv-head"><div style="flex:2">Name</div><div style="flex:2">Logo</div><div style="flex:2">Website</div><div style="flex-basis:80px;text-align:center">Footer</div><div style="flex-basis:100px;text-align:right"></div></div>
      ${sponsors.map(sp => `<div class="p-inv-row">
        <div style="flex:2"><div class="p-inv-name">${escHtml(sp.name)}</div></div>
        <div style="flex:2">${sp.logo_url ? `<img src="${escHtml(sp.logo_url)}" alt="" style="max-height:34px; max-width:140px;">` : '<span style="color:var(--fg-4); font-size:12px;">no logo</span>'}</div>
        <div style="flex:2; font-size:12px; color:var(--fg-3); word-break:break-all;">${escHtml(sp.website_url||'')}</div>
        <div style="flex-basis:80px; text-align:center; font-size:12px; color:${sp.show_in_footer?'var(--status-ok)':'var(--fg-4)'};">${sp.show_in_footer?'Yes':'-'}</div>
        <div style="flex-basis:100px; text-align:right" class="row-actions"><button data-edit="${sp.id}">Edit</button><button class="danger" data-del="${sp.id}">x</button></div>
      </div>`).join('')}
    </div>
  `;
  body.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if(!confirm('Remove this sponsor?')) return;
    await apiDel('/api/sponsors/'+b.dataset.del); renderAdmin($('#mainContent'));
  });
  body.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openSp(sponsors.find(s=>s.id==b.dataset.edit)));
  $('#newSp').onclick = () => openSp(null);
  function openSp(sp) {
    const isNew = !sp; sp = sp || {name:'', logo_url:'', website_url:'', sort_order:0, show_in_footer:0};
    modal(isNew?'Add sponsor':'Edit sponsor','',`
      <label>Name</label><input id="m_n" value="${escHtml(sp.name||'')}">
      <label>Website URL</label><input id="m_w" value="${escHtml(sp.website_url||'')}">
      <label>Logo (upload)</label>
      <div style="display:flex; gap:10px; align-items:center;">
        ${sp.logo_url ? `<img src="${escHtml(sp.logo_url)}" alt="" style="max-height:40px; max-width:120px;">` : ''}
        <input type="file" id="m_lf" accept="image/*">
      </div>
      <label>Logo URL (or use upload above)</label><input id="m_l" value="${escHtml(sp.logo_url||'')}">
      <label>Sort order</label><input id="m_s" type="number" value="${sp.sort_order||0}">
      <label><input type="checkbox" id="m_sf" ${sp.show_in_footer?'checked':''}> Show in footer</label>
    `, async (mb) => {
      const lf = $('#m_lf', mb);
      if (lf && lf.files && lf.files[0]) {
        const url = await uploadPhoto(lf.files[0]);
        $('#m_l', mb).value = url;
      }
      const body = { name:$('#m_n',mb).value, logo_url:$('#m_l',mb).value, website_url:$('#m_w',mb).value, sort_order:+$('#m_s',mb).value, show_in_footer: $('#m_sf', mb).checked ? 1 : 0 };
      if(isNew) await apiPost('/api/sponsors', body); else await apiPut('/api/sponsors/'+sp.id, body);
      renderAdmin($('#mainContent'));
    });
  }
}

async function renderAppsTab(body) {
  const apps = await apiGet('/api/apps/all').catch(()=>[]);
  body.innerHTML = `
    <div style="font-size:13px; color:var(--fg-3); margin-bottom:14px;">HTML mini-apps and calculators that appear on the public site Apps page. Each entry needs a title, short summary, and a link to the app.</div>
    <div class="p-inv-toolbar"><button class="btn-primary-sm" id="newApp">+ Add app</button></div>
    <div class="p-inv-table">
      <div class="p-inv-row p-inv-head"><div style="flex:2">App</div><div style="flex:1">Slug</div><div style="flex:2">Summary</div><div style="flex-basis:80px;text-align:center">Live</div><div style="flex-basis:100px;text-align:right"></div></div>
      ${apps.map(a => `<div class="p-inv-row">
        <div style="flex:2"><div class="p-inv-name">${escHtml(a.title)}</div><div style="font-size:11px;color:var(--fg-4)"><a href="${escHtml(a.url||'#')}" target="_blank" style="color:var(--fg-4); text-decoration:underline;">${escHtml(a.url||'(no url)')}</a></div></div>
        <div style="flex:1"><code class="p-mono">${escHtml(a.slug)}</code></div>
        <div style="flex:2; font-size:12px; color:var(--fg-2);">${escHtml(a.summary||'')}</div>
        <div style="flex-basis:80px; text-align:center; font-size:12px; color:${a.published?'var(--status-ok)':'var(--fg-4)'};">${a.published?'Yes':'Draft'}</div>
        <div style="flex-basis:100px; text-align:right" class="row-actions"><button data-edit="${a.id}">Edit</button><button class="danger" data-del="${a.id}">x</button></div>
      </div>`).join('')}
    </div>
  `;
  body.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if(!confirm('Remove this app?')) return;
    await apiDel('/api/apps/'+b.dataset.del); renderAdmin($('#mainContent'));
  });
  body.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openApp(apps.find(a=>a.id==b.dataset.edit)));
  $('#newApp').onclick = () => openApp(null);
  function openApp(a) {
    const isNew = !a; a = a || {slug:'', title:'', summary:'', description:'', url:'', sort_order:0, published:1};
    modal(isNew?'Add app':'Edit app','',`
      <label>Title</label><input id="m_t" value="${escHtml(a.title||'')}">
      <label>Slug (URL-safe id)</label><input id="m_sl" value="${escHtml(a.slug||'')}">
      <label>Summary (one line)</label><input id="m_su" value="${escHtml(a.summary||'')}">
      <label>Description</label><textarea id="m_d">${escHtml(a.description||'')}</textarea>
      <label>App URL (where users open it)</label><input id="m_u" value="${escHtml(a.url||'')}" placeholder="https://... or /apps/your-app">
      <label>Sort order</label><input id="m_so" type="number" value="${a.sort_order||0}">
      <label><input type="checkbox" id="m_pub" ${a.published?'checked':''}> Published (visible on public site)</label>
    `, async (mb) => {
      const body = { slug:$('#m_sl',mb).value.trim(), title:$('#m_t',mb).value, summary:$('#m_su',mb).value, description:$('#m_d',mb).value, url:$('#m_u',mb).value, sort_order:+$('#m_so',mb).value, published: $('#m_pub', mb).checked ? 1 : 0 };
      if(!body.slug || !body.title) throw new Error('Slug and title required');
      if(isNew) await apiPost('/api/apps', body); else await apiPut('/api/apps/'+a.id, body);
      renderAdmin($('#mainContent'));
    });
  }
}

      </div>

    </div>
    <div class="p-banner" style="background:var(--gold-100); border:1px solid var(--gold-300); color:var(--gold-900); padding:12px 16px; border-radius:10px; margin-bottom:20px; font-size:13px;">
      <strong>What is here:</strong> people, news, publications, research, facilities, hero, gallery, sponsors, apps, settings. <strong>What moved:</strong> schedule / tasks / meetings / equipment / issues live at <a href="/platform" style="color:var(--gold-900); text-decoration:underline;">/platform</a>.

        <button class="btn-primary-sm" onclick="navigate('content')">Open content editor</button>
      </div>
      <div class="p-card">
        <div class="p-card-head"><div class="p-card-title">Quick links</div></div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          <a class="w-link-gold" href="/" target="_blank">View public site &rarr;</a>
          <a class="w-link-gold" href="/platform">Open lab platform &rarr;</a>
        </div>
      </div>
    </div>
  `;
  $('#ovLogout').onclick = doLogout;
  try {
    const [people, pubs, news, research, sponsors, gallery] = await Promise.all([
      apiGet('/api/people').catch(()=>[]), apiGet('/api/publications').catch(()=>[]), apiGet('/api/news').catch(()=>[]),
      apiGet('/api/research').catch(()=>[]), apiGet('/api/sponsors').catch(()=>[]), apiGet('/api/gallery').catch(()=>[]),
    ]);
    $('#ovStats').innerHTML = [
      ['News', news.length, 'megaphone'],['Publications', pubs.length, 'book-open'],['Research', research.length, 'flask-conical'],
      ['People', people.length, 'users'],['Sponsors', sponsors.length, 'briefcase'],['Gallery', gallery.length, 'image'],
    ].map(([lbl,n,icn]) => `<div class="p-stat-card"><i data-lucide="${icn}" class="p-stat-icon"></i><div class="p-stat-num">${n}</div><div class="p-stat-lbl">${lbl}</div></div>`).join('');

  } catch(e){ console.error(e); }
}

const ROUTES = { overview: renderOverview, content: renderAdmin, schedule: renderSchedule, tasks: renderTasks, meetings: renderMeetings, inventory: renderInventory, projects: renderProjects };

async function doLogout() {
  await fetch('/admin/logout',{method:'POST',credentials:'same-origin'}).catch(()=>{});
  CSRF = '';
  $('#appShell').style.display = 'none';
  $('#loginScreen').style.display = 'flex';
}

async function boot() {
  $('#loginForm').onsubmit = async (e) => {
    e.preventDefault();
    $('#lErr').textContent = '';
    try {
      await doLogin($('#lUser').value, $('#lPass').value);
      $('#loginScreen').style.display = 'none';
      $('#appShell').style.display = 'flex';
      $('#userInitials').textContent = SESSION_USER.initials;
      $('#userName').textContent = SESSION_USER.name;
      $('#userRole').textContent = SESSION_USER.role;
      navigate('overview');
    } catch(err) { $('#lErr').textContent = err.message; }
  };
  $('#logoutBtn').onclick = doLogout;
  const ok = await checkAuth();
  if (ok) {
    $('#loginScreen').style.display = 'none';
    $('#appShell').style.display = 'flex';
    $('#userInitials').textContent = SESSION_USER.initials;
    $('#userName').textContent = SESSION_USER.name;
    $('#userRole').textContent = SESSION_USER.role;
    renderNav();
    navigate('overview');
  }
  if (window.lucide) window.lucide.createIcons();
}

boot();
</script>
