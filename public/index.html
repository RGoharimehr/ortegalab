/* ============================================================

   ============================================================ */
:root {

  --fg-1:var(--navy-900); --fg-2:var(--gray-700); --fg-3:var(--gray-500); --fg-4:var(--gray-400); --fg-inv:#fff;

  --radius-xs:4px; --radius-sm:6px; --radius-md:8px; --radius-lg:12px; --radius-xl:16px; --radius-pill:999px;

.w-footer ul { list-style: none; padding: 0; margin: 0; }
.w-footer ul li { font-size: 13px; padding: 4px 0; cursor: pointer; color: rgba(255,255,255,.7); }
.w-footer ul li:hover { color: #fff; }
.w-footer-bottom { border-top: 1px solid rgba(255,255,255,.08); padding: 18px 24px; font-size: 12px; color: rgba(255,255,255,.4); text-align: center; }

/* Page panes (non-home) */
.w-page { padding: 56px 0; min-height: 60vh; background: #fff; }
.w-page.alt { background: var(--bg-2); }
.w-page h1.w-page-title { font-size: clamp(1.8rem, 3.5vw, 2.5rem); font-weight: 800; letter-spacing: -.025em; line-height: 1.1; margin: 6px 0 12px; color: var(--navy-900); }
.w-page p.w-page-intro { font-size: 1.0625rem; color: var(--fg-2); line-height: 1.65; margin: 0 0 36px; max-width: 720px; }
.w-grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 22px; }
.w-grid-2 { display: grid; grid-template-columns: repeat(2,1fr); gap: 22px; }
.w-card { background: #fff; border: 1px solid var(--border-1); border-radius: 12px; padding: 20px; box-shadow: var(--shadow-xs); transition: box-shadow .2s; }
.w-card:hover { box-shadow: var(--shadow-md); }
.w-card h3 { color: var(--navy-900); font-size: 16px; margin: 0 0 6px; font-weight: 700; }
.w-card p { color: var(--fg-3); font-size: 13px; line-height: 1.55; margin: 0; }
.w-download-title { display:flex; align-items:center; gap:14px; min-width:0; }
.w-download-thumb { width:72px; height:56px; border-radius:12px; border:1px solid var(--border-1); background:var(--bg-1); object-fit:contain; padding:6px; flex:0 0 auto; }
.w-download-fileicon { width:72px; height:56px; border-radius:12px; border:1px solid var(--border-1); background:linear-gradient(135deg,var(--navy-900),#27496f); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; letter-spacing:.08em; flex:0 0 auto; }
.w-download-row .w-pub-left { align-self: center; justify-content: flex-start; }
.w-download-row .w-pub-yr { font-size: 17px; line-height: 1.05; }
.w-person { background: #fff; border: 1px solid var(--border-1); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-xs); transition: box-shadow .2s, transform .2s; cursor: pointer; width: 200px; flex: 0 0 200px; text-align: center; }
.w-person:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.w-person-img { width: 120px; height: 120px; border-radius: 50%; background: var(--gray-100) center/cover no-repeat; margin: 22px auto 12px; border: 3px solid #fff; box-shadow: var(--shadow-sm); }
.w-person-body { padding: 0 14px 18px; }
.w-person-name { font-size: 14px; font-weight: 700; color: var(--navy-900); margin: 0 0 2px; }
.w-person-role { font-size: 11.5px; color: var(--fg-3); margin: 0 0 6px; line-height: 1.35; }
.w-person-cat { display: inline-block; font-size: 9.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--gold-100); color: var(--gold-900); margin-top: 2px; }
.w-people-row { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; margin-top: 12px; }
.w-person-detail { background:#fff; border:1px solid var(--border-1); border-radius:14px; padding:32px; max-width: 720px; margin: 0 auto; box-shadow: var(--shadow-sm); }
.w-person-detail-img { width: 180px; height: 180px; border-radius: 50%; background: var(--gray-100) center/cover no-repeat; margin: 0 auto 18px; border: 4px solid #fff; box-shadow: var(--shadow-md); }
.w-person-detail h2 { font-size: 1.6rem; margin: 0 0 4px; text-align:center; }
.w-person-detail .sub { text-align:center; color: var(--fg-3); margin: 0 0 18px; font-size: 14px; }
.w-person-detail .bio { font-size: 14px; color: var(--fg-2); line-height: 1.7; white-space: pre-wrap; margin: 18px 0; }
.w-person-detail .links { display:flex; flex-wrap:wrap; gap: 8px; justify-content:center; margin-top: 18px; }
.w-person-detail .links a { background: var(--bg-1); border:1px solid var(--border-1); padding: 6px 14px; border-radius: 999px; font-size: 12px; color: var(--navy-900); text-decoration: none; font-weight: 600; }
.w-person-detail .links a:hover { background: var(--gold-100); border-color: var(--gold-300); color: var(--gold-900); }
.w-back-link { display:inline-block; font-size:12px; font-weight:600; color:var(--gold-700); margin-bottom: 18px; cursor:pointer; text-decoration:none; }
.w-back-link:hover { color: var(--gold-900); }
.w-pub-row { display: grid; grid-template-columns: 60px 1fr auto; gap: 18px; align-items: start; padding: 16px 4px; border-bottom: 1px solid var(--border-1); }
.w-pub-row .w-yr { font-family: var(--font-display); font-weight: 600; color: var(--gold-700); font-size: 22px; line-height: 1; }
.w-pub-row .w-pub-t { font-size: 14px; font-weight: 600; color: var(--navy-900); margin: 0 0 3px; line-height: 1.35; }
.w-pub-row .w-pub-a { font-size: 12px; color: var(--fg-3); margin: 0; }
.w-pub-row .w-pub-v { font-size: 11px; color: var(--fg-4); font-style: italic; margin-top: 2px; }

/* Publications â€” polished */
.w-pub-list { background: #fff; border: 1px solid var(--border-1); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-xs); }
.w-pub-row2 { display: grid; grid-template-columns: 92px 1fr 96px; gap: 22px; padding: 22px 22px; border-bottom: 1px solid var(--border-1); align-items: center; transition: background .15s; }
.w-pub-row2:last-child { border-bottom: none; }
.w-pub-row2:hover { background: var(--gold-50); }
.w-pub-left { position: relative; display: flex; align-items: center; min-height: 32px; }
.w-pub-yr { font-family: var(--font-sans); font-weight: 800; color: var(--gold-700); font-size: 22px; line-height: 1; letter-spacing: -.03em; }
.w-pub-title2 { font-size: 16px; font-weight: 600; color: var(--navy-900); margin: 0 0 6px; line-height: 1.35; letter-spacing: -.01em; }
.w-pub-authors { font-size: 13px; color: var(--fg-2); margin: 0 0 4px; }
.w-pub-venue { font-size: 12px; color: var(--gold-700); font-style: italic; }
.w-pub-right { display: flex; flex-direction: column; gap: 7px; align-items: center; justify-content: center; align-self: center; }
.w-pub-btn { background: var(--navy-900); color: #fff; min-width: 64px; min-height: 31px; padding: 6px 10px; border: 0; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; font-family: inherit; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; text-decoration: none; text-align: center; cursor: pointer; transition: background .15s; }
.w-pub-btn:hover { background: var(--gold-700); color: #fff; }
.w-pub-btn.ghost { background: #fff; color: var(--fg-2); border: 1px solid var(--border-1); }
.w-pub-btn.ghost:hover { background: var(--bg-1); color: var(--gold-700); border-color: var(--gold-300); }

/* News â€” with thumbnail */
.w-news-card { display: flex; gap: 18px; align-items: stretch; padding: 18px 20px; border: 1px solid var(--border-1); border-radius: 12px; background: #fff; transition: box-shadow .2s, transform .2s; }
.w-news-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.w-news-thumb { width: 140px; height: 100px; object-fit: cover; border-radius: 8px; flex-shrink: 0; background: var(--bg-1); }
.w-news-body-wrap { flex: 1; min-width: 0; }
.w-news-date { font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--gold-700); letter-spacing: .08em; margin-bottom: 4px; }
.w-news-title { font-size: 16px; font-weight: 700; color: var(--navy-900); margin: 0 0 6px; line-height: 1.35; }
.w-news-body { font-size: 13px; color: var(--fg-2); line-height: 1.6; margin: 0; }
.w-news-detail { background: #fff; border: 1px solid var(--border-1); border-radius: 14px; padding: 36px; max-width: 820px; margin: 0 auto; box-shadow: var(--shadow-sm); }
.w-news-detail-img { width: 100%; max-height: 380px; object-fit: cover; border-radius: 10px; margin: 0 0 24px; }
.w-news-body-rich { font-size: 15px; color: var(--fg-2); line-height: 1.75; white-space: pre-wrap; }
.w-news-body-rich a { color: var(--gold-700); text-decoration: underline; }

/* Facilities â€” clickable cards */
.w-fac-card { background: #fff; border: 1px solid var(--border-1); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-xs); transition: box-shadow .2s, transform .2s; }
.w-fac-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.w-fac-img { aspect-ratio: 3/2; height: auto; background: var(--gray-100) center/cover no-repeat; }
.w-fac-img-empty { background: linear-gradient(135deg, var(--navy-700), var(--navy-900)); }
.w-fac-body { padding: 22px; }
.w-fac-title { font-size: 18px; font-weight: 700; color: var(--navy-900); margin: 0 0 8px; letter-spacing: -.01em; }
.w-fac-desc { font-size: 13px; color: var(--fg-2); line-height: 1.6; margin: 0 0 12px; }
.w-fac-cta { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--gold-700); }
.w-fac-detail { background: #fff; border: 1px solid var(--border-1); border-radius: 14px; padding: 36px; max-width: 880px; margin: 0 auto; box-shadow: var(--shadow-sm); }
.w-fac-detail-img { width: 100%; max-height: 460px; object-fit: cover; border-radius: 10px; margin: 0 0 24px; }
.w-doc-link { display: flex; align-items: center; gap: 14px; padding: 14px 18px; background: var(--bg-1); border: 1px solid var(--border-1); border-radius: 10px; text-decoration: none; transition: background .15s, border-color .15s; }
.w-doc-link:hover { background: var(--gold-50); border-color: var(--gold-300); }
.w-doc-icon { font-size: 22px; }
.w-doc-name { flex: 1; font-size: 14px; font-weight: 700; color: var(--navy-900); }
.w-doc-sub { font-size: 11px; font-weight: 700; color: var(--gold-700); letter-spacing: .06em; text-transform: uppercase; }
.w-page-section + .w-page-section { margin-top: 48px; }
.w-page-section h2 { font-size: 1.125rem; font-weight: 800; letter-spacing: -.01em; color: var(--navy-900); display: flex; align-items: center; gap: 10px; margin: 0 0 18px; }
.w-page-section h2::before { content: ""; width: 3px; height: 18px; background: var(--gold-600); border-radius: 2px; }

.w-empty { padding: 28px 0; color: var(--fg-3); font-size: 13px; }
.w-loading { padding: 28px 0; color: var(--fg-3); font-size: 13px; font-style: italic; }

@media (max-width: 1180px) {
  .w-nav-inner { gap: 18px; }
  .w-brand-img { height: 36px; }
  .w-nav-links { display: none; }
  .w-nav-toggle { display: block; }
  .w-nav-links.open { display: flex; flex-direction: column; position: absolute; top: 64px; left: 0; right: 0; background: var(--navy-900); padding: 12px 24px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .w-nav-links.open .w-nav-signin { margin: 12px 0 0; display: inline-flex; align-self: flex-start; }
  .w-hero-grid { grid-template-columns: 1fr; gap: 28px; }
  .w-hero-copy { max-width: none; }
  .w-hero-footer { gap: 20px; }
  .w-hero-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); width: 100%; }
  .w-research-layout { grid-template-columns: 1fr; gap: 20px; }
  .w-research-peek { position: relative; top: auto; }
  .w-research-peek-frame { aspect-ratio: 16 / 10; }
  .w-gallery-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .w-research-layout { grid-template-columns: 1fr; }
  .w-research-list { padding-right: 0; max-width: none; }
  .w-research-row { margin-right: 0; border-radius: 18px; }
  .w-research-row:hover, .w-research-row.is-hover { box-shadow: 0 14px 24px rgba(15,23,42,.07); }
  .w-research-peek { display: none; margin-left: 0; padding-left: 0; }
  .w-two { grid-template-columns: 1fr; }
  .w-footer-grid { grid-template-columns: 1fr 1fr; }
  .w-grid-3 { grid-template-columns: repeat(2,1fr); }
  .w-hero-metrics { gap: 22px; }
}
@media (max-width: 600px) {
  .w-grid-2, .w-grid-3 { grid-template-columns: 1fr; }
  .w-footer-grid { grid-template-columns: 1fr; gap: 24px; }
  .w-section { padding: 36px 0; }
  .w-gallery-strip { grid-template-columns: 1fr; }
  .w-gallery-slide { flex-basis: 320px; height: 220px; }
}

/* ============================================================
   LATFS UI v2 â€” harmonised type, colour & component upgrades
   ============================================================ */

/* â”€â”€ Interior page banner â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.w-page-banner {
  background: linear-gradient(160deg, var(--navy-950) 0%, var(--navy-800) 100%);
  padding: 72px 0 60px;
  border-bottom: 2px solid rgba(184,145,42,.3);
}
.w-page-banner .eyebrow {
  color: var(--gold-400);
  display: block;
  margin-bottom: 16px;
  font-size: var(--text-xs);
  letter-spacing: .14em;
}
.w-page-banner-title {
  color: #fff;
  font-size: clamp(1.85rem, 4vw, 2.75rem);
  font-weight: 800;
  letter-spacing: -.035em;
  line-height: 1.08;
  margin: 0 0 18px;
}
.w-page-banner-intro {
  color: rgba(255,255,255,.6);
  font-size: var(--text-lg);
  line-height: 1.72;
  max-width: 640px;
  margin: 0;
}

/* â”€â”€ Content area below the banner â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.w-page-content { padding: 56px 0; min-height: 36vh; background: var(--bg-2); }
.w-page-content.on-white { background: #fff; }

/* â”€â”€ Homepage quick links â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.w-quick-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
}
.w-quick-card {
  background: #fff;
  border: 1px solid var(--border-1);
  border-radius: 14px;
  padding: 18px;
  box-shadow: var(--shadow-xs);
  transition: transform .2s var(--ease-out), box-shadow .2s var(--ease-out), border-color .2s;
  cursor: pointer;
}
.w-quick-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
  border-color: var(--gold-300);
}
.w-quick-kicker {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--gold-700);
  margin-bottom: 10px;
}
.w-quick-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--navy-900);
  margin: 0 0 4px;
  letter-spacing: -.01em;
}
.w-quick-copy {
  font-size: 13px;
  color: var(--fg-3);
  line-height: 1.55;
  margin: 0 0 14px;
}
.w-quick-meta {
  font-size: 12px;
  font-weight: 700;
  color: var(--fg-2);
}

/* â”€â”€ Discovery filters â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.w-filter-shell {
  background: #fff;
  border: 1px solid var(--border-1);
  border-radius: 16px;
  padding: 18px;
  box-shadow: var(--shadow-xs);
  margin-bottom: 28px;
}
.w-filter-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
}
.w-filter-row + .w-filter-row { margin-top: 12px; }
.w-filter-search {
  position: relative;
  flex: 1 1 280px;
  min-width: 240px;
}
.w-filter-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--fg-4);
  font-size: 14px;
  pointer-events: none;
}
.w-filter-input,
.w-filter-select {
  width: 100%;
  border: 1px solid var(--border-1);
  border-radius: 12px;
  background: #fff;
  color: var(--fg-1);
  font: inherit;
  padding: 12px 14px;
}
.w-filter-input { padding-left: 38px; }
.w-filter-input::placeholder { color: var(--fg-4); }
.w-filter-input:focus,
.w-filter-select:focus {
  outline: none;
  border-color: var(--gold-500);
  box-shadow: 0 0 0 3px rgba(212,169,66,.16);
}
.w-filter-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.w-filter-pill {
  border: 1px solid var(--border-1);
  background: #fff;
  color: var(--fg-2);
  border-radius: 999px;
  padding: 8px 12px;
  font: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s, border-color .15s, color .15s;
}
.w-filter-pill:hover,
.w-filter-pill.active {
  background: var(--gold-50);
  border-color: var(--gold-300);
  color: var(--gold-900);
}
.w-filter-meta {
  margin-left: auto;
  font-size: 12px;
  color: var(--fg-3);
}
.w-results-stack {
  display: flex;
  flex-direction: column;
  gap: 28px;
}

/* â”€â”€ People grid â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.w-people-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 220px));
  gap: 28px;
  justify-content: center;
  margin-top: 20px;
}

/* â”€â”€ Person card v2 â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.w-person-v2 {
  background: transparent;
  border: 0;
  border-radius: 18px;
  overflow: visible;
  box-shadow: none;
  transition: transform .22s var(--ease-out);
  cursor: pointer;
  text-align: center;
  padding: 8px 10px 14px;
}
.w-person-v2:hover {
  transform: translateY(-3px);
}

/* â”€â”€ Avatar ring â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.w-avatar {
  position: relative;
  width: 148px;
  height: 148px;
  border-radius: 50%;
  margin: 0 auto 16px;
  overflow: hidden;
  flex-shrink: 0;
  border: 3px solid rgba(212,169,66,.18);
  box-shadow: 0 14px 24px rgba(15,23,42,.1);
  transition: border-color .22s, box-shadow .22s;
}
.w-person-v2:hover .w-avatar { border-color: var(--gold-400); box-shadow: 0 18px 28px rgba(15,23,42,.12); }
.w-avatar-photo {
  width: 100%; height: 100%;
  background-size: cover;
  background-position: center;
  background-color: var(--gray-200);
}
.w-avatar-text {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.35rem; font-weight: 800; letter-spacing: -.02em;
  color: rgba(255,255,255,.92);
  text-shadow: 0 1px 4px rgba(0,0,0,.3);
}

/* â”€â”€ Person card text slots â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.w-pv2-name { font-size: var(--text-sm); font-weight: 700; color: var(--navy-900); margin: 0 0 3px; padding: 0 12px; line-height: 1.3; }
.w-pv2-role { font-size: 12px; color: var(--fg-3); margin: 0 0 10px; padding: 0 10px; line-height: 1.4; }
.w-pv2-badge {
  display: inline-block;
  font-size: 9px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
  padding: 3px 10px; border-radius: 999px;
  background: var(--gold-100); color: var(--gold-900);
  border: 1px solid rgba(184,145,42,.2);
  margin-bottom: 16px;
}

/* â”€â”€ Research cards v2 (Research page) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
.w-rc {
  background: #fff;
  border: 1px solid var(--border-1);
  border-radius: 14px;
  padding: 24px;
  box-shadow: 0 1px 3px rgba(15,23,42,.05);
