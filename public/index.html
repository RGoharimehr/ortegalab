<style>
/* ============================================================
   LATFS Design System — synced with website-ui-kit
   ============================================================ */
:root {
  --navy-950:#080f24; --navy-900:#0f172a; --navy-800:#162041; --navy-700:#1e3a5f;
  --navy-600:#2d4a78; --navy-500:#4a6fa5;
  --gold-900:#7a5e15; --gold-700:#9a7820; --gold-600:#b8912a; --gold-500:#d4a942;
  --gold-300:#e8c972; --gold-100:#fef7e4; --gold-50:#fdfbf4;
  --gray-950:#0a0d13; --gray-900:#111827; --gray-800:#1f2937; --gray-700:#374151;
  --gray-600:#4b5563; --gray-500:#64748b; --gray-400:#94a3b8; --gray-300:#cbd5e1;
  --gray-200:#e2e8f0; --gray-100:#f1f5f9; --gray-50:#f8fafc;
  --status-ok:#16a34a; --status-warn:#d97706; --status-alert:#dc2626; --status-info:#0284c7;
  --fg-1:var(--navy-900); --fg-2:var(--gray-700); --fg-3:var(--gray-500); --fg-4:var(--gray-400); --fg-inv:#fff;
  --bg-1:#fff; --bg-2:var(--gray-50); --bg-3:var(--gray-100); --bg-dark:var(--navy-900);
  --border-1:var(--gray-200); --border-2:var(--gray-300);
  --accent:var(--gold-600); --accent-soft:var(--gold-100); --accent-hover:var(--gold-700);
  --shadow-xs:0 1px 2px rgba(15,23,42,.04);
  --shadow-sm:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
  --shadow-md:0 4px 12px rgba(15,23,42,.08);
  --shadow-lg:0 12px 32px rgba(15,23,42,.12);
  --radius-xs:4px; --radius-sm:6px; --radius-md:8px; --radius-lg:12px; --radius-xl:16px; --radius-pill:999px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px;
  --space-8:32px; --space-10:40px; --space-12:48px; --space-16:64px; --space-20:80px;
  --font-sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-display:'Fraunces','Iowan Old Style',Georgia,serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --text-xs:.75rem; --text-sm:.875rem; --text-base:1rem; --text-lg:1.125rem;
  --text-xl:1.25rem; --text-2xl:1.5rem; --text-3xl:1.875rem; --text-4xl:2.25rem; --text-5xl:3rem; --text-6xl:3.75rem;
  --ease-out:cubic-bezier(0.22,1,0.36,1); --ease-in-out:cubic-bezier(0.65,0,0.35,1);
  --dur-fast:150ms; --dur-base:220ms; --dur-slow:400ms;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg-2); }
body { font-family: var(--font-sans); font-size: var(--text-base); line-height: 1.6; color: var(--fg-1); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
h1, h2, h3, h4 { color: var(--fg-1); margin: 0; }
p { margin: 0; color: var(--fg-2); }
a { color: var(--navy-700); text-decoration: none; transition: color var(--dur-fast) var(--ease-out); }
a:hover { color: var(--gold-700); }
.max-w { max-width: min(1480px, 94vw); margin: 0 auto; padding: 0 24px; }
.eyebrow { font-size: var(--text-xs); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-700); }
.display-serif { font-family: var(--font-display); font-weight: 600; letter-spacing: -.02em; }

/* Nav */
.w-nav { background: var(--navy-900); position: sticky; top: 0; z-index: 30; border-bottom: 1px solid rgba(255,255,255,.06); }
.w-nav-inner { max-width: min(1480px, 94vw); margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; height: 56px; }
.w-brand { display: flex; align-items: center; cursor: pointer; gap: 10px; }
.w-brand-img { height: 38px; width: auto; display: block; }
.w-brand-text { color: #fff; font-weight: 800; letter-spacing: -.01em; font-size: 14px; }
.w-brand-text small { display: block; font-weight: 500; color: rgba(255,255,255,.55); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; margin-top: 1px; }
.w-nav-links { display: flex; gap: 2px; }
.w-nav-link { color: rgba(255,255,255,.65); font-size: 13px; font-weight: 500; padding: 8px 12px; border-radius: 4px; cursor: pointer; position: relative; transition: color .15s; user-select: none; }
.w-nav-signin { color: #fff; background: var(--gold-600); font-size: 12px; font-weight: 700; padding: 7px 14px; border-radius: 6px; margin-left: 12px; text-decoration: none; letter-spacing: .04em; text-transform: uppercase; transition: background .15s; }
.w-nav-signin:hover { background: var(--gold-700); color: #fff; }
.w-nav-link:hover { color: #fff; }
.w-nav-link.active { color: #fff; }
.w-nav-link.active::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -2px; height: 2px; background: var(--gold-600); border-radius: 1px; }
.w-nav-toggle { display: none; background: transparent; border: 0; color: #fff; font-size: 22px; cursor: pointer; }

/* Hero */
.w-hero { position: relative; overflow: hidden; min-height: 560px; background: var(--navy-700); color: #fff; }
.w-hero-slide { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 800ms var(--ease-out); }
.w-hero-slide.active { opacity: 1; }
.w-hero-overlay { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(15,23,42,.88) 0%, rgba(15,23,42,.58) 65%, rgba(15,23,42,.28) 100%); }
.w-hero-grain { position: absolute; inset: 0; opacity: .08; pointer-events: none; mix-blend-mode: overlay;
  background-image: radial-gradient(rgba(255,255,255,.4) 1px, transparent 1px); background-size: 3px 3px; }
.w-hero-content { position: relative; z-index: 2; max-width: min(1480px, 94vw); margin: 0 auto; padding: 96px 24px 24px; min-height: 460px; display: flex; flex-direction: column; justify-content: center; }
.w-hero-eyebrow { display: inline-flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.78); margin-bottom: 18px; }
.w-hero-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--gold-500); box-shadow: 0 0 0 3px rgba(212,169,66,.18); }
.w-hero-title { font-size: clamp(2rem, 5vw, 3.4rem); font-weight: 800; letter-spacing: -.035em; line-height: 1.05; margin: 8px 0 0; max-width: 880px; color: #fff; }
.w-amp { font-family: var(--font-display); font-weight: 500; font-style: italic; color: var(--gold-300); padding: 0 .04em; }

.w-hero-footer { position: relative; z-index: 2; max-width: min(1480px, 94vw); margin: 0 auto; padding: 0 24px 28px; display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.w-hero-metrics { display: flex; gap: 38px; flex-wrap: wrap; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.14); width: 100%; }
.w-metric { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.w-metric-num { font-size: 1.65rem; font-weight: 800; color: #fff; letter-spacing: -.02em; line-height: 1; }
.w-metric-lbl { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.55); }
.w-metric-badge { display: inline-flex; align-items: center; gap: 8px; padding: 4px 0; }
.w-metric-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--gold-500); }
.w-metric-badge .w-metric-lbl { color: var(--gold-300); font-weight: 700; letter-spacing: .08em; text-transform: none; font-size: 12px; }
.w-hero-dots { display: flex; gap: 6px; align-self: flex-end; padding-bottom: 4px; }
.w-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.4); border: none; cursor: pointer; padding: 0; transition: background .15s; }
.w-dot.active { background: #fff; }

/* Marquee keyframes (shared) */
@keyframes w-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

/* Sections */
.w-section { padding: 56px 0; }
.w-sh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; gap: 16px; flex-wrap: wrap; }
.w-sh-inner { display: flex; align-items: center; gap: 12px; }
.w-sh-bar { width: 3px; height: 22px; background: var(--gold-600); border-radius: 2px; }
.w-sh-title { font-size: 1.25rem; font-weight: 800; letter-spacing: -.02em; color: var(--navy-900); margin: 0; }
.w-link-gold { background: none; border: none; color: var(--gold-700); font-weight: 700; font-size: 13px; cursor: pointer; padding: 6px 0; font-family: inherit; }
.w-link-gold:hover { color: var(--gold-900); }
.w-research-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-4); }

/* Research */
.w-research { background: #fff; }
.w-research-layout { display: grid; grid-template-columns: 1fr 420px; gap: 40px; align-items: start; }
.w-research-list { border-top: 1px solid var(--border-1); }
.w-research-row { display: grid; grid-template-columns: 56px 1fr 24px; gap: 20px; align-items: start; padding: 20px 4px; border-bottom: 1px solid var(--border-1); text-decoration: none; color: inherit; cursor: pointer; transition: padding-left .2s ease, background .2s ease; }
.w-research-row:hover, .w-research-row.is-hover { padding-left: 14px; background: linear-gradient(90deg, rgba(200,162,74,.06) 0%, transparent 80%); }
.w-research-num { font-family: var(--font-sans); font-size: 22px; font-weight: 800; color: var(--gold-600); line-height: 1; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.w-research-title { font-family: var(--font-sans); font-size: 18px; font-weight: 700; color: var(--navy-900); margin: 0 0 4px; letter-spacing: -.015em; line-height: 1.25; }
.w-research-desc { font-size: 14px; color: var(--fg-3); line-height: 1.55; margin: 0 0 6px; max-width: 560px; }
.w-research-meta { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-4); }
.w-research-arrow { color: var(--fg-4); font-size: 18px; align-self: center; transition: transform .2s ease, color .2s ease; }
.w-research-row:hover .w-research-arrow, .w-research-row.is-hover .w-research-arrow { color: var(--gold-700); transform: translateX(4px); }
.w-research-peek { position: sticky; top: 80px; }
.w-research-peek-frame { position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 4/5; background: var(--navy-900); box-shadow: var(--shadow-md); }
.w-research-peek-img { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transform: scale(1.05); transition: opacity .5s ease, transform .6s ease; }
.w-research-peek-img.is-active { opacity: .8; transform: scale(1); }
.w-research-peek-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15,23,42,.1) 0%, rgba(15,23,42,.85) 100%); }
.w-research-peek-label { position: absolute; left: 24px; right: 24px; bottom: 22px; color: #fff; z-index: 2; }
.w-research-peek-num { font-size: 11px; font-weight: 800; color: var(--gold-500); letter-spacing: .14em; text-transform: uppercase; }
.w-research-peek-title { font-size: 19px; font-weight: 700; line-height: 1.25; letter-spacing: -.015em; margin-top: 4px; }

/* News + Featured Pub */
.w-two { display: grid; grid-template-columns: 2fr 1fr; gap: 40px; padding: 0 0 56px; }
.w-news-stack { display: flex; flex-direction: column; gap: 10px; }
.w-news-card { background: #fff; border: 1px solid var(--border-1); border-left: 3px solid var(--gold-600); border-radius: 10px; padding: 16px 18px; box-shadow: var(--shadow-xs); }
.w-news-date { font-size: 11px; color: var(--fg-4); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.w-news-title { font-size: 15px; font-weight: 700; color: var(--navy-900); margin: 4px 0 6px; }
.w-news-body { font-size: 13px; color: var(--fg-3); line-height: 1.55; margin: 0; }
.w-pub-card { background: #fff; border: 1px solid var(--border-1); border-radius: 12px; padding: 18px; box-shadow: var(--shadow-sm); }
.w-pub-year { display: inline-block; background: var(--navy-900); color: #fff; border-radius: 6px; padding: 3px 8px; font-size: 11px; font-weight: 800; margin-bottom: 10px; letter-spacing: .04em; }
.w-pub-title { font-family: var(--font-sans); font-size: 15px; font-weight: 700; color: var(--navy-900); line-height: 1.35; margin: 0 0 8px; letter-spacing: -.015em; }
.w-pub-authors { font-size: 13px; color: var(--fg-2); margin: 0 0 2px; }
.w-pub-venue { font-size: 12px; color: var(--fg-4); font-style: italic; margin: 0; }
.btn-ghost { background: transparent; border: 1.5px solid var(--border-2); color: var(--navy-900); border-radius: 6px; padding: 6px 12px; font-weight: 600; cursor: pointer; font-family: inherit; font-size: 12px; }
.btn-ghost:hover { border-color: var(--gold-600); color: var(--gold-700); }
.btn-primary { background: var(--gold-600); color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit; }
.btn-primary:hover { background: var(--gold-700); }

/* Photo gallery */
.w-gallery { background: var(--bg-2); padding: 48px 0 64px; }
.w-gallery-nav { display: flex; gap: 6px; }
.w-gallery-arrow { width: 38px; height: 38px; border-radius: 50%; background: #fff; border: 1px solid var(--border-1); color: var(--navy-900); font-size: 22px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: border-color .15s, color .15s, background .15s; }
.w-gallery-arrow:hover { border-color: var(--gold-600); color: var(--gold-700); background: var(--gold-50); }
.w-gallery-strip { display: flex; gap: 16px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; padding: 4px 0 14px; scrollbar-width: thin; scrollbar-color: var(--border-2) transparent; }
.w-gallery-strip::-webkit-scrollbar { height: 6px; }
.w-gallery-strip::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }
.w-gallery-slide { flex: 0 0 520px; height: 320px; position: relative; border-radius: 12px; overflow: hidden; scroll-snap-align: start; background: var(--navy-900); box-shadow: var(--shadow-xs); text-decoration: none; transition: box-shadow .2s var(--ease-out); }
.w-gallery-slide:hover { box-shadow: var(--shadow-md); }
.w-gallery-slide img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s var(--ease-out); }
.w-gallery-slide:hover img { transform: scale(1.04); }
.w-gallery-scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15,23,42,0) 50%, rgba(15,23,42,.92) 100%); }
.w-gallery-meta { position: absolute; left: 18px; right: 18px; bottom: 14px; color: #fff; }
.w-gallery-cat { font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-300); margin-bottom: 4px; }
.w-gallery-title { font-size: 16px; font-weight: 700; line-height: 1.3; }

/* Marquee — sponsors */
.w-marquee-wrap { overflow: hidden; padding: 20px 0; }
.w-marquee { display: flex; gap: 56px; align-items: center; animation: w-scroll 38s linear infinite; padding: 0 28px; width: max-content; }
.w-marquee:hover { animation-play-state: paused; }
.w-sponsor-logo { flex-shrink: 0; height: 52px; width: auto; max-width: 170px; object-fit: contain; filter: grayscale(1) opacity(.72); transition: filter .25s ease; }
.w-sponsor-logo:hover { filter: grayscale(0) opacity(1); }

/* Footer */
.w-footer { background: var(--navy-900); color: rgba(255,255,255,.7); }
.w-footer-anchor { padding: 28px 24px 22px; border-bottom: 1px solid rgba(255,255,255,.08); text-align: center; }
.w-anchor-label { font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.4); margin-bottom: 14px; }
.w-anchor-row { display: flex; align-items: center; justify-content: center; gap: 44px; flex-wrap: wrap; }
.w-anchor-logo { height: 54px; width: auto; filter: invert(1) brightness(1.2); }
.w-anchor-div { width: 1px; height: 40px; background: rgba(255,255,255,.12); }
.w-foot-logo { height: 44px; width: auto; margin-bottom: 10px; filter: brightness(0) invert(1); }
.w-footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 40px; padding: 40px 24px; }
.w-foot-sub { font-size: 13px; line-height: 1.6; color: rgba(255,255,255,.6); margin: 0; }
.w-foot-h { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.45); margin: 0 0 10px; font-weight: 700; }
.w-footer ul { list-style: none; padding: 0; margin: 0; }
.w-footer ul li { font-size: 13px; padding: 4px 0; cursor: pointer; color: rgba(255,255,255,.7); }
.w-footer ul li:hover { color: #fff; }
.w-footer-bottom { border-top: 1px solid rgba(255,255,255,.08); padding: 18px 24px; font-size: 12px; color: rgba(255,255,255,.4); text-align: center; }

/* Page panes (non-home) */
.w-page { padding: 56px 0; min-height: 60vh; background: #fff; }
.w-page.alt { background: var(--bg-2); }
.w-page h1.w-page-title { font-size: clamp(1.8rem, 3.5vw, 2.5rem); font-weight: 800; letter-spacing: -.025em; line-height: 1.1; margin: 6px 0 12px; color: var(--navy-900); }
.w-page p.w-page-intro { font-size: 1.0625rem; color: var(--fg-2); line-height: 1.65; margin: 0 0 36px; max-width: 720px; }
.w-grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 22px; }
.w-grid-2 { display: grid; grid-template-columns: repeat(2,1fr); gap: 22px; }
.w-card { background: #fff; border: 1px solid var(--border-1); border-radius: 12px; padding: 20px; box-shadow: var(--shadow-xs); transition: box-shadow .2s; }
.w-card:hover { box-shadow: var(--shadow-md); }
.w-card h3 { color: var(--navy-900); font-size: 16px; margin: 0 0 6px; font-weight: 700; }
.w-card p { color: var(--fg-3); font-size: 13px; line-height: 1.55; margin: 0; }
.w-person { background: #fff; border: 1px solid var(--border-1); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-xs); transition: box-shadow .2s, transform .2s; cursor: pointer; width: 200px; flex: 0 0 200px; text-align: center; }
.w-person:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.w-person-img { width: 120px; height: 120px; border-radius: 50%; background: var(--gray-100) center/cover no-repeat; margin: 22px auto 12px; border: 3px solid #fff; box-shadow: var(--shadow-sm); }
.w-person-body { padding: 0 14px 18px; }
.w-person-name { font-size: 14px; font-weight: 700; color: var(--navy-900); margin: 0 0 2px; }
.w-person-role { font-size: 11.5px; color: var(--fg-3); margin: 0 0 6px; line-height: 1.35; }
.w-person-cat { display: inline-block; font-size: 9.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--gold-100); color: var(--gold-900); margin-top: 2px; }
.w-people-row { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; margin-top: 12px; }
.w-person-detail { background:#fff; border:1px solid var(--border-1); border-radius:14px; padding:32px; max-width: 720px; margin: 0 auto; box-shadow: var(--shadow-sm); }
.w-person-detail-img { width: 180px; height: 180px; border-radius: 50%; background: var(--gray-100) center/cover no-repeat; margin: 0 auto 18px; border: 4px solid #fff; box-shadow: var(--shadow-md); }
.w-person-detail h2 { font-size: 1.6rem; margin: 0 0 4px; text-align:center; }
.w-person-detail .sub { text-align:center; color: var(--fg-3); margin: 0 0 18px; font-size: 14px; }
.w-person-detail .bio { font-size: 14px; color: var(--fg-2); line-height: 1.7; white-space: pre-wrap; margin: 18px 0; }
.w-person-detail .links { display:flex; flex-wrap:wrap; gap: 8px; justify-content:center; margin-top: 18px; }
.w-person-detail .links a { background: var(--bg-1); border:1px solid var(--border-1); padding: 6px 14px; border-radius: 999px; font-size: 12px; color: var(--navy-900); text-decoration: none; font-weight: 600; }
.w-person-detail .links a:hover { background: var(--gold-100); border-color: var(--gold-300); color: var(--gold-900); }
.w-back-link { display:inline-block; font-size:12px; font-weight:600; color:var(--gold-700); margin-bottom: 18px; cursor:pointer; text-decoration:none; }
.w-back-link:hover { color: var(--gold-900); }
.w-pub-row { display: grid; grid-template-columns: 60px 1fr auto; gap: 18px; align-items: start; padding: 16px 4px; border-bottom: 1px solid var(--border-1); }
.w-pub-row .w-yr { font-family: var(--font-display); font-weight: 600; color: var(--gold-700); font-size: 22px; line-height: 1; }
.w-pub-row .w-pub-t { font-size: 14px; font-weight: 600; color: var(--navy-900); margin: 0 0 3px; line-height: 1.35; }

.w-pub-row .w-pub-v { font-size: 11px; color: var(--fg-4); font-style: italic; margin-top: 2px; }

/* Publications — polished */
.w-pub-list { background: #fff; border: 1px solid var(--border-1); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-xs); }
.w-pub-row2 { display: grid; grid-template-columns: 84px 1fr auto; gap: 22px; padding: 22px 22px; border-bottom: 1px solid var(--border-1); align-items: flex-start; transition: background .15s; }

.w-pub-row2:hover { background: var(--gold-50); }
.w-pub-left { position: relative; }
.w-pub-yr { font-family: var(--font-display); font-weight: 600; color: var(--gold-700); font-size: 28px; line-height: 1; letter-spacing: -.02em; }
.w-pub-title2 { font-size: 16px; font-weight: 600; color: var(--navy-900); margin: 0 0 6px; line-height: 1.35; letter-spacing: -.01em; }

.w-pub-right { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.w-pub-btn { background: var(--navy-900); color: #fff; padding: 6px 14px; border-radius: 6px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; text-decoration: none; transition: background .15s; }
.w-pub-btn:hover { background: var(--gold-700); color: #fff; }
.w-pub-btn.ghost { background: #fff; color: var(--fg-2); border: 1px solid var(--border-1); }
.w-pub-btn.ghost:hover { background: var(--bg-1); color: var(--gold-700); border-color: var(--gold-300); }

/* News — with thumbnail */
.w-news-card { display: flex; gap: 18px; align-items: stretch; padding: 18px 20px; border: 1px solid var(--border-1); border-radius: 12px; background: #fff; transition: box-shadow .2s, transform .2s; }
.w-news-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.w-news-thumb { width: 140px; height: 100px; object-fit: cover; border-radius: 8px; flex-shrink: 0; background: var(--bg-1); }
.w-news-body-wrap { flex: 1; min-width: 0; }
.w-news-date { font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--gold-700); letter-spacing: .08em; margin-bottom: 4px; }
.w-news-title { font-size: 16px; font-weight: 700; color: var(--navy-900); margin: 0 0 6px; line-height: 1.35; }
.w-news-body { font-size: 13px; color: var(--fg-2); line-height: 1.6; margin: 0; }
.w-news-detail { background: #fff; border: 1px solid var(--border-1); border-radius: 14px; padding: 36px; max-width: 820px; margin: 0 auto; box-shadow: var(--shadow-sm); }
.w-news-detail-img { width: 100%; max-height: 380px; object-fit: cover; border-radius: 10px; margin: 0 0 24px; }
.w-news-body-rich { font-size: 15px; color: var(--fg-2); line-height: 1.75; white-space: pre-wrap; }
.w-news-body-rich a { color: var(--gold-700); text-decoration: underline; }

/* Facilities — clickable cards */
.w-fac-card { background: #fff; border: 1px solid var(--border-1); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-xs); transition: box-shadow .2s, transform .2s; }
.w-fac-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.w-fac-img { height: 200px; background: var(--gray-100) center/cover no-repeat; }
.w-fac-img-empty { background: linear-gradient(135deg, var(--navy-700), var(--navy-900)); }
.w-fac-body { padding: 22px; }
.w-fac-title { font-size: 18px; font-weight: 700; color: var(--navy-900); margin: 0 0 8px; letter-spacing: -.01em; }
.w-fac-desc { font-size: 13px; color: var(--fg-2); line-height: 1.6; margin: 0 0 12px; }
.w-fac-cta { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--gold-700); }

.w-fac-detail-img { width: 100%; max-height: 460px; object-fit: cover; border-radius: 10px; margin: 0 0 24px; }
.w-doc-link { display: flex; align-items: center; gap: 14px; padding: 14px 18px; background: var(--bg-1); border: 1px solid var(--border-1); border-radius: 10px; text-decoration: none; transition: background .15s, border-color .15s; }
.w-doc-link:hover { background: var(--gold-50); border-color: var(--gold-300); }
.w-doc-icon { font-size: 22px; }
.w-doc-name { flex: 1; font-size: 14px; font-weight: 700; color: var(--navy-900); }

.w-page-section + .w-page-section { margin-top: 48px; }
.w-page-section h2 { font-size: 1.125rem; font-weight: 800; letter-spacing: -.01em; color: var(--navy-900); display: flex; align-items: center; gap: 10px; margin: 0 0 18px; }
.w-page-section h2::before { content: ""; width: 3px; height: 18px; background: var(--gold-600); border-radius: 2px; }

.w-empty { padding: 28px 0; color: var(--fg-3); font-size: 13px; }

@media (max-width: 900px) {
  .w-research-layout { grid-template-columns: 1fr; }
  .w-research-peek { display: none; }
  .w-two { grid-template-columns: 1fr; }
  .w-footer-grid { grid-template-columns: 1fr 1fr; }
  .w-grid-3 { grid-template-columns: repeat(2,1fr); }
  .w-nav-links { display: none; }
  .w-nav-toggle { display: block; }
  .w-nav-links.open { display: flex; flex-direction: column; position: absolute; top: 56px; left: 0; right: 0; background: var(--navy-900); padding: 12px 24px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .w-hero-metrics { gap: 22px; }
}

  .w-grid-2, .w-grid-3 { grid-template-columns: 1fr; }
  .w-footer-grid { grid-template-columns: 1fr; gap: 24px; }

}

<body>
<div id="app"></div>

<script>
/* ============================================================
   LATFS public website — vanilla JS port of the website-ui-kit
   ============================================================ */
const RES = {
  logoColor:  '/assets/latfs-logo.svg',
  latfsWhite: '/assets/latfs-logo-white.svg',
  hero1:      '/assets/hero-1.png',
  hero2:      '/assets/hero-2.png',
  hero3:      '/assets/hero-3.png',
  fac1:       '/assets/facility-1.png',
  fac2:       '/assets/facility-2.png',
  fac3:       '/assets/facility-3.png',
  fac4:       '/assets/facility-4.png',
  rDroplet:   '/assets/research-droplet.png',
  rMini:      '/assets/research-minichannel.png',
  rGeo:       '/assets/research-geothermal.png',
  spIntel:    '/assets/sponsors/intel.svg',
  spAmd:      '/assets/sponsors/amd.svg',
  spHoneywell:'/assets/sponsors/honeywell.svg',
  spRtx:      '/assets/sponsors/rtx.svg',
  spTi:       '/assets/sponsors/ti.svg',
  spSrc:      '/assets/sponsors/src.svg',
  spNasa:     '/assets/sponsors/nasa.svg',
  spDarpa:    '/assets/sponsors/darpa.svg',
  spE3s:      '/assets/sponsors/e3s.svg',
  spVillanova:'/assets/sponsors/villanova.svg',
};

/* ---- DOM helper ---- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v != null && v !== false) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid);
  }
  return el;
}
function el(html) { const t = document.createElement('template'); t.innerHTML = html; return t.content.firstElementChild; }
function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]); }
async function getJSON(url) {
  try { const r = await fetch(url); if (!r.ok) return null; return await r.json(); }
  catch (_) { return null; }
}

/* ---- Routes ---- */
const NAV = [
  ['home', 'Home'],
  ['research', 'Research'],
  ['people', 'People'],
  ['publications', 'Publications'],
  ['facilities', 'Facilities'],
  ['apps', 'Apps'],
  ['news', 'News'],
  ['join', 'Join'],
  ['contact', 'Contact'],
];

let state = { route: 'home', heroSlides: [], heroIdx: 0, heroTimer: null, navOpen: false };

function go(route) {
  state.route = route;
  state.navOpen = false;
  if (location.hash !== '#' + route) history.replaceState(null, '', '#' + route);
  render();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

window.addEventListener('hashchange', () => {
  const r = location.hash.replace('#', '') || 'home';
  if (r !== state.route) { state.route = r; render(); }
});

/* ---- Components ---- */
function Nav() {
  const links = NAV.map(([id, label]) =>
    h('span', {
      class: 'w-nav-link' + (state.route === id ? ' active' : ''),
      onclick: () => go(id),
    }, label)
  );
  const wrap = h('nav', { class: 'w-nav' },
    h('div', { class: 'w-nav-inner' },
      h('div', { class: 'w-brand', onclick: () => go('home') },
        h('img', { src: RES.logoColor, alt: 'LATFS', class: 'w-brand-img' }),
        h('div', { class: 'w-brand-text' }, 'LATFS', h('small', null, 'Villanova University'))
      ),
      h('div', { class: 'w-nav-links' + (state.navOpen ? ' open' : '') },
        ...links,
        h('a', { class: 'w-nav-signin', href: '/platform' }, 'Sign in')
      ),
      h('button', { class: 'w-nav-toggle', 'aria-label': 'Menu', onclick: () => { state.navOpen = !state.navOpen; render(); } }, '☰')
    )
  );
  return wrap;
}

function Hero(slides) {
  const usable = (slides && slides.length) ? slides : [
    { image_url: RES.hero2, title: '', subtitle: '' },
    { image_url: RES.hero3, title: '', subtitle: '' },
  ];
  state.heroSlides = usable;

  const slideEls = usable.map((s, i) =>
    h('div', { class: 'w-hero-slide' + (i === state.heroIdx ? ' active' : ''),
      style: { backgroundImage: `url(${s.image_url || s})` } })
  );

  const dotEls = usable.map((_, i) =>
    h('button', {
      class: 'w-dot' + (i === state.heroIdx ? ' active' : ''),
      'aria-label': 'Slide ' + (i+1),
      onclick: () => { state.heroIdx = i; restartHeroTimer(); render(); }
    })
  );

  const metrics = h('div', { class: 'w-hero-metrics' },
    metric('06', 'Research pillars'),
    metric('30+', 'Publications'),
    metric('15', 'Lab members'),
    metric('02', 'Lab spaces'),
    metric(null, 'NSF E3S Center Partner', true),
  );

  const hero = h('section', { class: 'w-hero' },
    ...slideEls,
    h('div', { class: 'w-hero-overlay' }),
    h('div', { class: 'w-hero-grain' }),
    h('div', { class: 'w-hero-content' },
      h('div', { class: 'w-hero-eyebrow' },
        h('span', { class: 'w-hero-dot' }),
        'Villanova University · Department of Mechanical Engineering'
      ),
      h('h1', { class: 'w-hero-title', html: 'Laboratory for Advanced<br>Thermal <span class="w-amp">&amp;</span> Fluid Systems' }),
    ),
    h('div', { class: 'w-hero-footer' },
      metrics,
      h('div', { class: 'w-hero-dots' }, ...dotEls)
    ),
  );
  return hero;
}
function metric(num, label, badge) {
  return h('div', { class: 'w-metric' + (badge ? ' w-metric-badge' : '') },
    num ? h('span', { class: 'w-metric-num' }, num) : null,
    h('span', { class: 'w-metric-lbl' }, label),
  );
}
function restartHeroTimer() {
  if (state.heroTimer) clearInterval(state.heroTimer);
  state.heroTimer = setInterval(() => {
    if (!state.heroSlides.length) return;
    state.heroIdx = (state.heroIdx + 1) % state.heroSlides.length;
    const slides = document.querySelectorAll('.w-hero-slide');
    slides.forEach((el,i) => el.classList.toggle('active', i === state.heroIdx));
    document.querySelectorAll('.w-hero-dots .w-dot').forEach((el,i) => el.classList.toggle('active', i === state.heroIdx));
  }, 6000);
}

function SectionHeader(title, action) {
  const inner = h('div', { class: 'w-sh-inner' },
    h('div', { class: 'w-sh-bar' }),
    h('h2', { class: 'w-sh-title' }, title),
  );
  return action
    ? h('div', { class: 'w-sh' }, inner, h('button', { class: 'w-link-gold', onclick: action.onClick }, action.label + ' →'))
    : h('div', { class: 'w-sh' }, inner);
}

function ResearchGrid(rows) {
  // Map server rows (from /api/research) into the kit's 6-pillar shape.
  const fallback = [
    { n: '01', title: 'Two-Phase & Boiling Heat Transfer', meta: '12 active projects · 8 publications', desc: 'Boiling, condensation, and droplet impingement in mini- and micro-channels.', img: RES.rDroplet },
    { n: '02', title: 'Microchannel Heat Exchangers', meta: 'Industry partnership · Intel, AMD', desc: 'Water-cooled silicon-carbide cold plates for high-flux electronics.', img: RES.rMini },
    { n: '03', title: 'Energy Efficient Electronic Systems', meta: 'NSF E³S Center', desc: 'Thermal management for future computing — the Villanova node of the multi-university center.', img: RES.hero2 },
    { n: '04', title: 'Renewable & Geothermal Energy', meta: 'DOE funded · 2022–2025', desc: 'Underground storage, solar-thermal, and working-fluid characterization.', img: RES.rGeo },
    { n: '05', title: 'Jets & Complex Flow', meta: 'Graduate research', desc: 'Synthetic and steady jets, vortex dynamics, and convective enhancement.', img: RES.hero3 },
    { n: '06', title: 'Experimental Techniques', meta: 'PIV · IR · high-speed imaging', desc: 'Precision instrumentation shared across all experimental rigs.', img: RES.fac1 },
  ];
  let areas;
  if (Array.isArray(rows) && rows.length) {
    const imgs = [RES.rDroplet, RES.rMini, RES.hero2, RES.rGeo, RES.hero3, RES.fac1];
    areas = rows.slice(0, 6).map((r, i) => ({
      n: String(i+1).padStart(2, '0'),
      title: r.title || r.name || ('Pillar ' + (i+1)),
      desc: r.summary || r.description || r.desc || '',
      meta: r.meta || (r.tag || ''),
      img: r.image_url || imgs[i % imgs.length],
    }));
    while (areas.length < 6) areas.push(fallback[areas.length]);
  } else {
    areas = fallback;
  }

  let hover = null;
  const peekImgs = areas.map((a, i) =>
    h('div', { class: 'w-research-peek-img' + (i === 0 ? ' is-active' : ''),
               style: { backgroundImage: `url(${a.img})` }, 'data-idx': i })
  );
  const labelNum   = h('div', { class: 'w-research-peek-num' }, areas[0].n);
  const labelTitle = h('div', { class: 'w-research-peek-title' }, areas[0].title);
  const setHover = (i) => {
    hover = i;
    peekImgs.forEach((el, idx) => el.classList.toggle('is-active', idx === i));
    labelNum.textContent = areas[i].n;
    labelTitle.textContent = areas[i].title;
    rowEls.forEach((el, idx) => el.classList.toggle('is-hover', idx === i));
  };

  const rowEls = areas.map((a, i) =>
    h('a', {
      class: 'w-research-row',
      href: '#research',
      onclick: (e) => { e.preventDefault(); go('research'); },
      onmouseenter: () => setHover(i),
      onfocus: () => setHover(i),
    },
      h('span', { class: 'w-research-num' }, a.n),
      h('div', { class: 'w-research-copy' },
        h('h3', { class: 'w-research-title' }, a.title),
        h('p',  { class: 'w-research-desc' },  a.desc),
        h('div',{ class: 'w-research-meta' }, a.meta),
      ),
      h('span', { class: 'w-research-arrow' }, '→'),
    )
  );

  return h('section', { class: 'w-section w-research' },
    h('div', { class: 'max-w' },
      h('div', { class: 'w-sh', style: { marginBottom: '32px' } },
        h('div', { class: 'w-sh-inner' },
          h('div', { class: 'w-sh-bar' }),
          h('h2',  { class: 'w-sh-title' }, 'Research Areas'),
        ),
        h('div', { class: 'w-research-eyebrow' }, 'Six pillars · updated quarterly'),
      ),
      h('div', { class: 'w-research-layout' },
        h('div', { class: 'w-research-list' }, ...rowEls),
        h('div', { class: 'w-research-peek' },
          h('div', { class: 'w-research-peek-frame' },
            ...peekImgs,
            h('div', { class: 'w-research-peek-overlay' }),
            h('div', { class: 'w-research-peek-label' }, labelNum, labelTitle),
          )
        )
      )
    )
  );
}

function NewsList(news) {
  const items = (news && news.length) ? news.slice(0,3) : [
    { date: 'MAR 20, 2024', title: 'LATFS joins NSF E3S Center', body: 'Villanova and LATFS formally join the NSF Industry/University Cooperative Research Center on Energy Efficient Electronic Systems.' },
    { date: 'FEB 14, 2024', title: 'Paper accepted at ITherm 2024', body: 'Numerical investigation of synthetic impinging jets on a heated surface, led by PhD candidate M. Reyes.' },
    { date: 'JAN 08, 2024', title: 'Two new PhD candidates welcomed', body: 'A. Park and D. Hernandez join the lab working on boiling heat transfer and two-phase flow instabilities.' },
  ];
  const formatted = items.map(n => {
    const d = n.date || n.published_at || n.created_at;
    let when = d;
    if (d && /^\d{4}-\d{2}-\d{2}/.test(d)) {
      const dt = new Date(d);
      when = dt.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' }).toUpperCase();
    }
    return { date: when || '', title: n.title || '', body: n.body || n.summary || n.description || '' };
  });
  return h('div', null,
    SectionHeader('Latest News'),
    h('div', { class: 'w-news-stack' },
      ...formatted.map(n =>
        h('article', { class: 'w-news-card' },
          h('div', { class: 'w-news-date' }, n.date),
          h('h3',  { class: 'w-news-title' }, n.title),
          h('p',   { class: 'w-news-body' },  n.body),
        )
      )
    ),
    h('button', { class: 'w-link-gold', style: { marginTop: '10px' }, onclick: () => go('news') }, 'View all news →')
  );
}

function FeaturedPub(pubs) {
  const top = (pubs && pubs.length) ? pubs[0] : {
    title: 'Simulation of Two-Phase Flow and Heat Transfer in Mini- and Micro-Channels for Concentrating Photovoltaics Cooling',
    authors: 'A. Ortega, S. Kim, M. Reyes',
    venue: 'ASME ESFuelcell · 2024',
    year: 2024,
  };
  return h('div', null,
    SectionHeader('Featured Publication'),
    h('div', { class: 'w-pub-card' },
      h('div', { class: 'w-pub-year' }, String(top.year || '—')),
      h('h3',  { class: 'w-pub-title' }, top.title || ''),
      h('p',   { class: 'w-pub-authors' }, top.authors || ''),
      h('p',   { class: 'w-pub-venue' }, top.venue || ''),
      top.pdf_url
        ? h('a', { class: 'btn-ghost', style: { marginTop: '8px', display: 'inline-block' }, href: top.pdf_url, target: '_blank' }, 'Download PDF ↓')
        : h('button', { class: 'btn-ghost', style: { marginTop: '8px' } }, 'Download PDF ↓')
    )
  );
}

function PhotoGallery(gallery) {
  const photos = (gallery && gallery.length) ? gallery.map(g => ({
    id: g.id, src: g.image_url || g.src || RES.fac1,
    cat: g.category || 'Lab life', title: g.caption || g.title || ''
  })) : [
    { id:1,  src: RES.fac1,     cat: 'Facilities', title: 'Flow-boiling test rig' },
    { id:2,  src: RES.rDroplet, cat: 'Research',   title: 'Droplet impingement' },
    { id:3,  src: RES.hero1,    cat: 'Lab life',   title: 'Student assembling test section' },
    { id:4,  src: RES.fac2,     cat: 'Facilities', title: 'Optical PIV bench' },
    { id:5,  src: RES.rMini,    cat: 'Research',   title: 'Microchannel array' },
    { id:6,  src: RES.hero2,    cat: 'Lab life',   title: 'Group seminar' },
    { id:7,  src: RES.fac3,     cat: 'Facilities', title: 'Environmental chamber' },
    { id:8,  src: RES.rGeo,     cat: 'Research',   title: 'Borehole rig' },
    { id:9,  src: RES.hero3,    cat: 'Lab life',   title: 'Poster session' },
    { id:10, src: RES.fac4,     cat: 'Facilities', title: 'IR thermography' },
  ];
  let stripRef;
  const scroll = (dir) => {
    if (!stripRef) return;
    const tile = stripRef.querySelector('.w-gallery-slide');
    const step = tile ? tile.getBoundingClientRect().width + 16 : 320;
    stripRef.scrollBy({ left: dir * step * 2, behavior: 'smooth' });
  };
  const strip = h('div', { class: 'w-gallery-strip' },
    ...photos.map(p =>

function fmtNewsDate(when) {
  if (!when) return '';
  if (/^\d{4}-\d{2}-\d{2}/.test(when)) {
    const dt = new Date(when);
    return dt.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' }).toUpperCase();
  }
  return when;
}

const PAGES = { home: Home, research: PageResearch, people: PagePeople, publications: PagePublications, facilities: PageFacilities, apps: PageApps, news: PageNews, join: PageJoin, contact: PageContact };

function render() {
  const root = document.getElementById('app');
  root.innerHTML = '';
  root.appendChild(Nav());
  const m = /^([a-z]+)\/(.+)$/.exec(state.route || '');
  let pageEl;
  if (m) {
    const [, kind, id] = m;
    if (kind === 'person')        pageEl = PagePersonDetail(id);
    else if (kind === 'news')     pageEl = PageNewsDetail(id);
    else if (kind === 'facility') pageEl = PageFacilityDetail(id);
    else pageEl = (PAGES[kind] || Home)();
  } else {
    const Page = PAGES[state.route] || Home;
    pageEl = Page();
  }
  root.appendChild(pageEl);
  root.appendChild(Footer());
  if (state.route === 'home') restartHeroTimer();
  else if (state.heroTimer) { clearInterval(state.heroTimer); state.heroTimer = null; }
}

(async function init() {
  state.route = (location.hash.replace('#','') || 'home');
  render();
  await loadAll();
  render();
})();
